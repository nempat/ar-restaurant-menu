<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#000000">

  <title>AR Menu</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #050505;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px;

      background:
        linear-gradient(
          rgba(0,0,0,.9),
          rgba(0,0,0,0)
        );
    }

    .back {
      width: 44px;
      height: 44px;

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;

      background: rgba(255,255,255,.1);
      color: white;

      font-size: 25px;
      cursor: pointer;

      backdrop-filter: blur(15px);
    }

    .title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    #ar-button {
      position: absolute;

      left: 50%;
      bottom: 155px;

      transform: translateX(-50%);

      min-width: 190px;

      padding: 16px 25px;

      border: 0;
      border-radius: 999px;

      background: white;
      color: black;

      font-size: 15px;
      font-weight: 900;

      box-shadow:
        0 15px 45px rgba(0,0,0,.5);

      cursor: pointer;
    }

    #ar-button:active {
      transform:
        translateX(-50%)
        scale(.96);
    }

    .info {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 20px;

      z-index: 15;

      padding: 19px;

      border:
        1px solid
        rgba(255,255,255,.1);

      border-radius: 23px;

      background:
        rgba(10,10,10,.82);

      backdrop-filter: blur(20px);

      box-shadow:
        0 15px 50px rgba(0,0,0,.5);
    }

    .food-name {
      font-size: 23px;
      font-weight: 850;
    }

    .price {
      margin-top: 5px;
      color: #ccc;
      font-size: 17px;
    }

    .hint {
      margin-top: 10px;
      color: #777;
      font-size: 12px;
    }

    .loading {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050505;

      color: #999;
      font-size: 14px;
    }

  </style>

</head>

<body>

<div
  id="loading"
  class="loading">

  Loading 3D experience...

</div>


<div class="topbar">

  <button
    class="back"
    onclick="history.back()">

    ‹

  </button>

  <div
    id="restaurantTitle"
    class="title">

    AR MENU

  </div>

</div>


<model-viewer
  id="viewer"

  ar

  ar-modes="webxr"

  camera-controls

  touch-action="pan-y"

  shadow-intensity="1"

  exposure="1.1"

  auto-rotate

  rotation-per-second="20deg"

  camera-orbit="0deg 65deg 2.5m"

  min-camera-orbit="auto auto 0.8m"

  max-camera-orbit="auto auto 5m"

  alt="3D food model">

  <button
    id="ar-button"
    slot="ar-button">

    ✨ View in AR

  </button>

</model-viewer>


<div class="info">

  <div
    id="foodName"
    class="food-name">

    Loading...

  </div>

  <div
    id="foodPrice"
    class="price">

    --

  </div>

  <div class="hint">

    Drag to rotate • Pinch to zoom • View in AR to place it

  </div>

</div>


<script src="ar.js"></script>

</body>

</html>
