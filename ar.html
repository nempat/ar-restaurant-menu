<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Pizza AR</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #050505;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;

      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;

      background: linear-gradient(
        rgba(0,0,0,0.75),
        rgba(0,0,0,0)
      );
    }

    .back {
      border: 0;
      border-radius: 50%;
      width: 42px;
      height: 42px;

      background: rgba(255,255,255,0.12);
      color: white;

      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
    }

    .info {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 24px;
      z-index: 10;

      padding: 18px;

      border-radius: 20px;

      background: rgba(15,15,15,0.82);
      backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.1);
    }

    .food-name {
      font-size: 22px;
      font-weight: 800;
    }

    .price {
      margin-top: 5px;
      font-size: 16px;
      color: #d8d8d8;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #999;
    }

    #ar-button {
      position: fixed;
      left: 50%;
      bottom: 150px;
      transform: translateX(-50%);

      z-index: 20;

      border: 0;
      border-radius: 999px;

      padding: 15px 25px;

      background: white;
      color: black;

      font-size: 15px;
      font-weight: 800;

      box-shadow: 0 10px 30px rgba(0,0,0,0.4);

      cursor: pointer;
    }

    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <button class="back" onclick="history.back()">‹</button>

    <div class="title">
      NEMPAT AR
    </div>
  </div>

  <model-viewer
    src="assets/models/pizza.glb"

    ar
    ar-modes="webxr scene-viewer quick-look"

    camera-controls
    touch-action="pan-y"

    shadow-intensity="1"
    exposure="1.1"

    auto-rotate
    rotation-per-second="20deg"

    camera-orbit="0deg 65deg 2.5m"
    min-camera-orbit="auto auto 0.8m"
    max-camera-orbit="auto auto 5m"

    scale="1 1 1"

    alt="3D pizza">

    <button
      id="ar-button"
      slot="ar-button">
      ✨ View in AR
    </button>

  </model-viewer>

  <div class="info">
    <div class="food-name">
      Classic Pizza
    </div>

    <div class="price">
      ₹299
    </div>

    <div class="hint">
      Drag to rotate • Pinch to zoom • Tap View in AR
    </div>
  </div>

</body>
</html>
