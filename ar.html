<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>AR Menu</title>

  <link
    rel="stylesheet"
    href="ar.css"
  >

</head>

<body>

  <div
    id="loading"
    class="loading">

    <div>

      <div class="loader"></div>

      <p>
        Preparing AR...
      </p>

    </div>

  </div>


  <div
    id="unsupported"
    class="message hidden">

    <div>

      <div class="big-icon">
        📱
      </div>

      <h1>
        AR isn't supported
      </h1>

      <p>
        Your current browser or device
        doesn't support browser-based
        camera AR.
      </p>

      <button
        onclick="history.back()">

        Go Back

      </button>

    </div>

  </div>


  <div
    id="permission"
    class="message hidden">

    <div>

      <div class="big-icon">
        ✨
      </div>

      <h1>
        Ready for AR
      </h1>

      <p>
        Move your phone slowly until
        a surface is detected.
      </p>

      <button id="startAR">

        Start AR

      </button>

    </div>

  </div>


  <video
    id="camera"
    autoplay
    playsinline>
  </video>


  <canvas
    id="arCanvas">
  </canvas>


  <div
    id="topbar"
    class="topbar hidden">

    <button
      id="exitButton"
      class="round-button">

      ‹

    </button>

    <div
      id="foodTitle"
      class="title">

      AR FOOD

    </div>

  </div>


  <div
    id="instructions"
    class="instructions hidden">

    <div class="instruction-dot"></div>

    Move your phone slowly

  </div>


  <div
    id="placeButton"
    class="place-button hidden">

    Tap to place 🍕

  </div>


  <div
    id="placedControls"
    class="placed-controls hidden">

    <button id="removeButton">
      Remove
    </button>

    <button id="doneButton">
      Done
    </button>

  </div>


  <div
    id="info"
    class="info hidden">

    <div
      id="foodName"
      class="food-name">

      Pizza

    </div>

    <div
      id="foodPrice"
      class="food-price">

      ₹299

    </div>

  </div>


  <script
    type="module"
    src="ar.js">
  </script>

</body>

</html>
