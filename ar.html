```html
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>NEMPAT AR</title>

  <!-- AR styling -->
  <link
    rel="stylesheet"
    href="ar.css?v=20"
  >

</head>


<body>

  <!-- =========================================
       LOADING
  ========================================== -->

  <div
    id="loading"
    class="loading"
  >

    <div>

      <div class="loader"></div>

      <p>
        Preparing AR...
      </p>

    </div>

  </div>


  <!-- =========================================
       UNSUPPORTED / ERROR
  ========================================== -->

  <div
    id="unsupported"
    class="message hidden"
  >

    <div>

      <div class="big-icon">
        📱
      </div>

      <h1>
        AR isn't supported
      </h1>

      <p>
        This device or browser does not support
        markerless browser AR.
      </p>

      <button
        id="backUnsupported"
      >
        Go Back
      </button>

    </div>

  </div>


  <!-- =========================================
       READY SCREEN
  ========================================== -->

  <div
    id="permission"
    class="message hidden"
  >

    <div>

      <div class="big-icon">
        ✨
      </div>

      <h1>
        Ready for AR
      </h1>

      <p>
        Point your phone at a table or other
        flat surface and move slowly.
      </p>

      <button
        id="startAR"
      >
        Start AR
      </button>

    </div>

  </div>


  <!-- =========================================
       THREE.JS CANVAS
  ========================================== -->

  <canvas
    id="arCanvas"
  ></canvas>


  <!-- =========================================
       TOP BAR
  ========================================== -->

  <div
    id="topbar"
    class="topbar hidden"
  >

    <button
      id="exitButton"
      class="round-button"
      aria-label="Exit AR"
    >
      ‹
    </button>

    <div
      id="foodTitle"
      class="title"
    >
      AR FOOD
    </div>

  </div>


  <!-- =========================================
       SURFACE INSTRUCTIONS
  ========================================== -->

  <div
    id="instructions"
    class="instructions hidden"
  >

    <div
      class="instruction-dot"
    ></div>

    Move your phone slowly

  </div>


  <!-- =========================================
       PLACE BUTTON
  ========================================== -->

  <button
    id="placeButton"
    class="place-button hidden"
  >
    Tap to place 🍕
  </button>


  <!-- =========================================
       PLACED CONTROLS
  ========================================== -->

  <div
    id="placedControls"
    class="placed-controls hidden"
  >

    <button
      id="removeButton"
    >
      Remove
    </button>

    <button
      id="doneButton"
    >
      Done
    </button>

  </div>


  <!-- =========================================
       FOOD INFORMATION
  ========================================== -->

  <div
    id="info"
    class="info hidden"
  >

    <div
      id="foodName"
      class="food-name"
    >
      Pizza
    </div>

    <div
      id="foodPrice"
      class="food-price"
    >
      ₹299
    </div>

  </div>


  <!-- =========================================
       IMPORTANT:
       v=20 forces a fresh ar.js request
  ========================================== -->

  <script
    type="module"
    src="ar.js?v=20"
  ></script>


</body>

</html>
```
