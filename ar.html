<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    http-equiv="Permissions-Policy"
    content="xr-spatial-tracking=(self)"
  >

  <title>NEMPAT AR</title>

  <link
    rel="stylesheet"
    href="ar.css?v=30"
  >

</head>


<body>

  <div
    id="loading"
    class="screen"
  >

    <div class="loader-box">

      <div class="loader"></div>

      <h2>
        Preparing AR...
      </h2>

      <p>
        Loading the AR experience
      </p>

    </div>

  </div>


  <div
    id="ready"
    class="screen hidden"
  >

    <div class="ready-box">

      <div class="icon">
        ✨
      </div>

      <h1>
        Ready for AR
      </h1>

      <p>
        Point your phone at a table
        and tap Start AR.
      </p>

      <button id="startAR">
        Start AR
      </button>

    </div>

  </div>


  <div
    id="error"
    class="screen hidden"
  >

    <div class="error-box">

      <div class="icon">
        ⚠️
      </div>

      <h1>
        AR could not start
      </h1>

      <p id="errorText">
        Something went wrong.
      </p>

      <button
        onclick="history.back()"
      >
        Go Back
      </button>

    </div>

  </div>


  <canvas
    id="arCanvas"
  ></canvas>


  <div
    id="topbar"
    class="topbar hidden"
  >

    <button
      id="exitButton"
      class="round-button"
    >
      ‹
    </button>

    <div
      id="foodTitle"
      class="title"
    >
      NEMPAT AR
    </div>

  </div>


  <div
    id="instructions"
    class="instructions hidden"
  >

    <span class="dot"></span>

    Move your phone slowly over the table

  </div>


  <button
    id="placeButton"
    class="place-button hidden"
  >
    Tap to place 🍕
  </button>


  <div
    id="placedControls"
    class="placed-controls hidden"
  >

    <button id="removeButton">
      Remove
    </button>

    <button
      id="doneButton"
      class="done"
    >
      Done
    </button>

  </div>


  <div
    id="info"
    class="info hidden"
  >

    <div
      id="foodName"
      class="food-name"
    >
      Classic Pizza
    </div>

    <div
      id="foodPrice"
      class="food-price"
    >
      ₹299
    </div>

  </div>


  <script
    type="module"
    src="ar.js?v=30"
  ></script>

</body>

</html>
