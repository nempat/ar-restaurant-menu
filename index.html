<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>AR Menu v5</title>

<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:system-ui,sans-serif;
  background:#fff8f0;
  color:#2b1d14;
}

header{
  padding:26px 16px 6px;
  text-align:center;
}

h1{
  margin:0;
  font-size:1.6rem;
}

header p{
  margin:6px 0 0;
  color:#8a7566;
  font-size:.92rem;
}

main{
  max-width:900px;
  margin:0 auto;
  padding:16px;
  display:grid;
  gap:18px;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px #0002;
}

.card model-viewer{
  width:100%;
  height:270px;
  background:#fff3e6;
}

.info{
  padding:14px 16px 16px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}

.row h2{
  margin:0;
  font-size:1.1rem;
}

.price{
  font-weight:700;
  color:#d9381e;
}

.info p{
  margin:6px 0 10px;
  color:#8a7566;
  font-size:.9rem;
}

.btn{
  background:#d9381e;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-size:.95rem;
  font-weight:600;
  width:100%;
  cursor:pointer;
}

.ar-btn{
  position:absolute;
  bottom:12px;
  right:12px;
  background:#2b1d14;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 16px;
  font-size:.9rem;
  font-weight:600;
}

.note{
  margin:8px 16px 0;
  font-size:.8rem;
  color:#b00020;
  display:none;
}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

#cam{

  position:fixed;

  inset:0;

  width:100vw;
  height:100dvh;

  z-index:99;

  background:#000;

  display:none;

  overflow:hidden;

  /*
   * CRITICAL FOR MOBILE
   */
  touch-action:none;

  overscroll-behavior:none;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;
}


/* =====================================================
   CAMERA
===================================================== */

#cam video{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  /*
   * Camera should NEVER receive
   * touch events.
   */
  pointer-events:none;

  user-select:none;
}


/* =====================================================
   FALLBACK PIZZA
===================================================== */

#fallback-model{

  position:absolute;

  width:280px;
  height:280px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(0deg)
    scale(1);

  background:transparent;

  --poster-color:transparent;
  --progress-bar-color:transparent;

  display:none;

  /*
   * VERY IMPORTANT:
   *
   * Pizza doesn't receive touches.
   * #cam receives them instead.
   */
  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
}


/* =====================================================
   CLOSE
===================================================== */

#camx{

  position:absolute;

  top:14px;
  right:14px;

  z-index:20;

  background:#fff;

  border:0;

  border-radius:999px;

  padding:10px 16px;

  font-weight:700;

  cursor:pointer;

  touch-action:manipulation;
}


/* =====================================================
   PLACE / MOVE BUTTON
===================================================== */

#placeBtn{

  position:absolute;

  bottom:65px;

  left:50%;

  transform:translateX(-50%);

  z-index:20;

  background:#d9381e;

  color:#fff;

  border:0;

  border-radius:999px;

  padding:13px 23px;

  font-size:.95rem;

  font-weight:700;

  display:none;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   TIP
===================================================== */

#camtip{

  position:absolute;

  bottom:22px;

  left:0;
  right:0;

  padding:0 15px;

  text-align:center;

  color:#fff;

  font-size:.9rem;

  text-shadow:0 1px 4px #000;

  z-index:15;

  pointer-events:none;
}


@media(max-width:600px){

  #fallback-model{
    width:250px;
    height:250px;
  }

  #placeBtn{
    bottom:70px;
    padding:14px 24px;
    font-size:1rem;
  }

  #camx{
    top:16px;
    right:16px;
    padding:11px 17px;
  }

}

</style>
</head>


<body>

<header>

  <h1>🍕 Our Menu (v3)</h1>

  <p>
    See the dish on your table through your camera. No app needed.
  </p>

</header>


<main id="menu"></main>


<!-- ==================================================
     CAMERA FALLBACK
================================================== -->

<div id="cam">

  <video
    id="camv"
    autoplay
    playsinline
    muted>
  </video>


  <model-viewer
    id="fallback-model"
    interaction-prompt="none"
    shadow-intensity="1">
  </model-viewer>


  <button id="placeBtn">
    ✓ Place Pizza
  </button>


  <button id="camx">
    ✕ Close
  </button>


  <div id="camtip">
    Drag • Pinch • Rotate, then tap Place Pizza
  </div>

</div>


<script>

/* =====================================================
   MENU
===================================================== */

const ITEMS = [

  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },

  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }

];


const PATHS = [

  'pizza.glb',
  'assets/pizza.glb',
  'models/pizza.glb'

];


/* =====================================================
   CREATE MENU
===================================================== */

document.getElementById('menu').innerHTML =

ITEMS.map((item,index) => `

  <article class="card">

    <model-viewer

      id="model-${index}"

      src="${PATHS[0]}"

      alt="${item.name}"

      ar

      ar-modes="webxr"

      ar-placement="floor"

      ar-scale="fixed"

      camera-controls

      auto-rotate

      shadow-intensity="1"

      touch-action="pan-y"

      interaction-prompt="auto"

      loading="lazy">

      <button
        slot="ar-button"
        class="ar-btn">

        📱 Place on surface

      </button>

    </model-viewer>


    <div class="note"></div>


    <div class="info">

      <div class="row">

        <h2>
          ${item.name}
        </h2>

        <span class="price">
          ${item.price}
        </span>

      </div>


      <p>
        ${item.desc}
      </p>


      <button
        class="btn camopen"
        data-index="${index}">

        📷 View with camera

      </button>

    </div>

  </article>

`).join('');


/* =====================================================
   MODEL FALLBACK
===================================================== */

document
.querySelectorAll('.card')
.forEach((card,index) => {

  const mv =
    card.querySelector('model-viewer');

  let pathIndex = 0;


  mv.addEventListener(
    'error',
    () => {

      pathIndex++;


      if(pathIndex < PATHS.length){

        mv.src =
          PATHS[pathIndex];

      }

      else{

        const note =
          card.querySelector('.note');

        note.style.display =
          'block';

        note.textContent =
          'pizza.glb not found in your repo.';

      }

    }
  );


  card
  .querySelector('.camopen')
  .addEventListener(
    'click',
    () => {

      openAR(mv.src);

    }
  );

});


/* =====================================================
   CAMERA ELEMENTS
===================================================== */

const cam =
  document.getElementById('cam');

const camv =
  document.getElementById('camv');

const fallbackModel =
  document.getElementById(
    'fallback-model'
  );

const placeBtn =
  document.getElementById(
    'placeBtn'
  );

const camtip =
  document.getElementById(
    'camtip'
  );

let stream = null;


/* =====================================================
   PIZZA STATE
===================================================== */

let pizzaLocked = false;

let pizzaX = 0;
let pizzaY = 0;

let pizzaScale = 1;

let pizzaRotation = 0;


/* =====================================================
   OPEN AR
===================================================== */

async function openAR(src){

  const webxrSupported =
    await checkWebXR();


  if(webxrSupported){

    const models =
      document.querySelectorAll(
        'model-viewer'
      );


    for(const model of models){

      if(model.src === src){

        try{

          await model.activateAR();

          return;

        }

        catch(error){

          console.log(
            'WebXR failed:',
            error
          );

        }

      }

    }

  }


  openCameraFallback(src);

}


/* =====================================================
   WEBXR CHECK
===================================================== */

async function checkWebXR(){

  if(!navigator.xr){

    return false;

  }


  try{

    return await navigator.xr.isSessionSupported(
      'immersive-ar'
    );

  }

  catch(error){

    console.log(
      'WebXR detection failed:',
      error
    );

    return false;

  }

}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

async function openCameraFallback(src){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:'environment'
          }
        },

        audio:false

      });


    camv.srcObject =
      stream;


    fallbackModel.src =
      src;


    /*
     * Center pizza
     */

    pizzaX =
      window.innerWidth / 2;

    pizzaY =
      window.innerHeight / 2;


    pizzaScale =
      1;

    pizzaRotation =
      0;

    pizzaLocked =
      false;


    updatePizza();


    placeBtn.textContent =
      '✓ Place Pizza';


    fallbackModel.style.display =
      'block';

    cam.style.display =
      'block';

    placeBtn.style.display =
      'block';


    camtip.textContent =
      'Drag • Pinch • Rotate, then tap Place Pizza';

  }

  catch(error){

    console.error(error);


    alert(
      'Camera could not start. ' +
      'Please allow camera permission ' +
      'and make sure this website uses HTTPS.'
    );

  }

}


/* =====================================================
   UPDATE PIZZA
===================================================== */

function updatePizza(){

  fallbackModel.style.left =
    pizzaX + 'px';

  fallbackModel.style.top =
    pizzaY + 'px';

  fallbackModel.style.transform =

    `
      translate(-50%,-50%)
      rotate(${pizzaRotation}deg)
      scale(${pizzaScale})
    `;

}


/* =====================================================
   MOBILE TOUCH GESTURES
===================================================== */

/*
 * This is deliberately native Touch Events.
 *
 * We DO NOT use:
 *
 * pointerdown
 * pointermove
 * pointerup
 *
 * on mobile.
 *
 * #cam receives the touches directly.
 */


let activeTouches = [];

let gesture = null;


/* =====================================================
   TOUCH POINT
===================================================== */

function getTouchPoint(touch){

  return {

    x:touch.clientX,

    y:touch.clientY

  };

}


/* =====================================================
   CENTER
===================================================== */

function getTouchCenter(a,b){

  return {

    x:(a.x + b.x) / 2,

    y:(a.y + b.y) / 2

  };

}


/* =====================================================
   DISTANCE
===================================================== */

function getTouchDistance(a,b){

  const dx =
    b.x - a.x;

  const dy =
    b.y - a.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =====================================================
   ANGLE
===================================================== */

function getTouchAngle(a,b){

  return Math.atan2(

    b.y - a.y,

    b.x - a.x

  ) * 180 / Math.PI;

}


/* =====================================================
   TOUCH START
===================================================== */

cam.addEventListener(

  'touchstart',

  function(event){

    /*
     * Don't interfere with buttons.
     */

    if(
      event.target === placeBtn ||
      event.target === document.getElementById('camx')
    ){

      return;

    }


    /*
     * Locked pizza cannot be changed.
     */

    if(pizzaLocked){

      return;

    }


    event.preventDefault();


    activeTouches =
      Array.from(
        event.touches
      ).map(getTouchPoint);


    /*
     * ONE FINGER
     */

    if(activeTouches.length === 1){

      const p =
        activeTouches[0];


      gesture = {

        type:'move',

        startX:p.x,

        startY:p.y,

        pizzaX:pizzaX,

        pizzaY:pizzaY

      };

    }


    /*
     * TWO FINGERS
     */

    else if(activeTouches.length >= 2){

      const a =
        activeTouches[0];

      const b =
        activeTouches[1];


      const center =
        getTouchCenter(a,b);


      gesture = {

        type:'transform',

        centerX:center.x,

        centerY:center.y,

        distance:
          getTouchDistance(a,b),

        angle:
          getTouchAngle(a,b),

        pizzaX:pizzaX,

        pizzaY:pizzaY,

        pizzaScale:pizzaScale,

        pizzaRotation:pizzaRotation

      };

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   TOUCH MOVE
===================================================== */

cam.addEventListener(

  'touchmove',

  function(event){

    if(pizzaLocked){

      return;

    }


    event.preventDefault();


    activeTouches =
      Array.from(
        event.touches
      ).map(getTouchPoint);


    /*
     * ================================================
     * ONE FINGER → MOVE
     * ================================================
     */

    if(

      activeTouches.length === 1 &&

      gesture &&

      gesture.type === 'move'

    ){

      const p =
        activeTouches[0];


      pizzaX =

        gesture.pizzaX +

        (
          p.x -
          gesture.startX
        );


      pizzaY =

        gesture.pizzaY +

        (
          p.y -
          gesture.startY
        );


      updatePizza();


      return;

    }


    /*
     * ================================================
     * TWO FINGERS → MOVE + PINCH + ROTATE
     * ================================================
     */

    if(

      activeTouches.length >= 2 &&

      gesture &&

      gesture.type === 'transform'

    ){

      const a =
        activeTouches[0];

      const b =
        activeTouches[1];


      const center =
        getTouchCenter(a,b);


      /*
       * MOVE
       */

      pizzaX =

        gesture.pizzaX +

        (
          center.x -
          gesture.centerX
        );


      pizzaY =

        gesture.pizzaY +

        (
          center.y -
          gesture.centerY
        );


      /*
       * PINCH
       */

      const distance =
        getTouchDistance(a,b);


      if(
        gesture.distance > 0
      ){

        pizzaScale =

          gesture.pizzaScale *

          (
            distance /
            gesture.distance
          );

      }


      /*
       * Limit size
       */

      pizzaScale =

        Math.max(

          0.35,

          Math.min(
            2.5,
            pizzaScale
          )

        );


      /*
       * ROTATION
       */

      const angle =
        getTouchAngle(a,b);


      pizzaRotation =

        gesture.pizzaRotation +

        (
          angle -
          gesture.angle
        );


      updatePizza();

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   TOUCH END
===================================================== */

cam.addEventListener(

  'touchend',

  function(event){

    if(pizzaLocked){

      return;

    }


    event.preventDefault();


    activeTouches =
      Array.from(
        event.touches
      ).map(getTouchPoint);


    /*
     * NO FINGERS
     */

    if(activeTouches.length === 0){

      gesture = null;

      return;

    }


    /*
     * ONE FINGER REMAINS
     *
     * Restart move gesture
     * without jumping.
     */

    if(activeTouches.length === 1){

      const p =
        activeTouches[0];


      gesture = {

        type:'move',

        startX:p.x,

        startY:p.y,

        pizzaX:pizzaX,

        pizzaY:pizzaY

      };

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   TOUCH CANCEL
===================================================== */

cam.addEventListener(

  'touchcancel',

  function(){

    activeTouches = [];

    gesture = null;

  },

  {
    passive:false
  }

);


/* =====================================================
   DESKTOP MOUSE SUPPORT
===================================================== */

let mouseDragging = false;

let mouseStartX = 0;
let mouseStartY = 0;

let mousePizzaX = 0;
let mousePizzaY = 0;


cam.addEventListener(
  'mousedown',
  function(event){

    if(pizzaLocked){

      return;

    }


    if(
      event.target === placeBtn ||
      event.target === document.getElementById('camx')
    ){

      return;

    }


    mouseDragging = true;


    mouseStartX =
      event.clientX;

    mouseStartY =
      event.clientY;


    mousePizzaX =
      pizzaX;

    mousePizzaY =
      pizzaY;

  }
);


window.addEventListener(
  'mousemove',
  function(event){

    if(
      !mouseDragging ||
      pizzaLocked
    ){

      return;

    }


    pizzaX =
      mousePizzaX +
      (
        event.clientX -
        mouseStartX
      );


    pizzaY =
      mousePizzaY +
      (
        event.clientY -
        mouseStartY
      );


    updatePizza();

  }
);


window.addEventListener(
  'mouseup',
  function(){

    mouseDragging = false;

  }
);


/* =====================================================
   PLACE / MOVE BUTTON
===================================================== */

placeBtn.addEventListener(

  'click',

  function(event){

    event.preventDefault();

    event.stopPropagation();


    /*
     * ================================================
     * FIX PIZZA
     * ================================================
     */

    if(!pizzaLocked){

      pizzaLocked =
        true;


      activeTouches = [];

      gesture = null;


      placeBtn.textContent =
        '↔ Move Pizza';


      camtip.textContent =
        '✓ Pizza fixed · Tap Move Pizza to reposition';


      return;

    }


    /*
     * ================================================
     * UNLOCK
     * ================================================
     */

    pizzaLocked =
      false;


    placeBtn.textContent =
      '✓ Place Pizza';


    camtip.textContent =
      'Drag • Pinch • Rotate, then tap Place Pizza';

  }

);


/* =====================================================
   CLOSE
===================================================== */

document
.getElementById('camx')
.addEventListener(

  'click',

  function(event){

    event.preventDefault();

    event.stopPropagation();

    closeCam();

  }

);


function closeCam(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  stream = null;

  camv.srcObject = null;


  fallbackModel.style.display =
    'none';


  placeBtn.style.display =
    'none';


  cam.style.display =
    'none';


  pizzaLocked =
    false;


  activeTouches = [];

  gesture = null;

  mouseDragging = false;

}


/* =====================================================
   PAGE CLEANUP
===================================================== */

window.addEventListener(
  'pagehide',
  closeCam
);

</script>

</body>
</html>
