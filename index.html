<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Menu v4</title>

<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>

<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:system-ui,sans-serif;
    background:#fff8f0;
    color:#2b1d14
  }

  header{
    padding:26px 16px 6px;
    text-align:center
  }

  h1{
    margin:0;
    font-size:1.6rem
  }

  header p{
    margin:6px 0 0;
    color:#8a7566;
    font-size:.92rem
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:16px;
    display:grid;
    gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr))
  }

  .card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 16px #0002
  }

  .card model-viewer{
    width:100%;
    height:270px;
    background:#fff3e6
  }

  .info{
    padding:14px 16px 16px
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline
  }

  .row h2{
    margin:0;
    font-size:1.1rem
  }

  .price{
    font-weight:700;
    color:#d9381e
  }

  .info p{
    margin:6px 0 10px;
    color:#8a7566;
    font-size:.9rem
  }

  .btn{
    background:#d9381e;
    color:#fff;
    border:0;
    border-radius:999px;
    padding:11px 18px;
    font-size:.95rem;
    font-weight:600;
    width:100%;
    cursor:pointer
  }

  .ar-btn{
    position:absolute;
    bottom:12px;
    right:12px;
    background:#2b1d14;
    color:#fff;
    border:0;
    border-radius:999px;
    padding:10px 16px;
    font-size:.9rem;
    font-weight:600;
    cursor:pointer
  }

  .note{
    margin:8px 16px 0;
    font-size:.8rem;
    color:#b00020;
    display:none
  }
</style>
</head>

<body>

<header>
  <h1>🍕 Our Menu (v3)</h1>
  <p>See the dish on your table through your camera. No app needed.</p>
</header>

<main id="menu"></main>

<script>

// ======================================================
// MENU
// ======================================================

const ITEMS = [
  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },
  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }
];


// ======================================================
// POSSIBLE MODEL LOCATIONS
// ======================================================

const PATHS = [
  'pizza.glb',
  'assets/pizza.glb',
  'models/pizza.glb'
];


// ======================================================
// CREATE MENU
// ======================================================

document.getElementById('menu').innerHTML = ITEMS.map((item, index) => `

  <article class="card">

    <model-viewer
      id="model-${index}"

      src="${PATHS[0]}"

      alt="${item.name}"

      /* ---------- REAL AR ---------- */

      ar

      ar-modes="webxr scene-viewer quick-look"

      ar-placement="floor"

      ar-scale="fixed"

      /* ----------------------------- */

      camera-controls

      auto-rotate

      shadow-intensity="1"

      touch-action="pan-y"

      interaction-prompt="auto"

      loading="lazy"

      style="
        --poster-color:#fff3e6;
        position:relative;
      "
    >

      <button
        slot="ar-button"
        class="ar-btn"
      >
        📱 Place on surface
      </button>

    </model-viewer>

    <div class="note"></div>

    <div class="info">

      <div class="row">

        <h2>${item.name}</h2>

        <span class="price">
          ${item.price}
        </span>

      </div>

      <p>
        ${item.desc}
      </p>

      <button
        class="btn camopen"
        data-index="${index}"
      >
        📷 View with camera
      </button>

    </div>

  </article>

`).join('');


// ======================================================
// MODEL ERROR / FALLBACK
// ======================================================

document.querySelectorAll('.card').forEach((card, index) => {

  const mv = card.querySelector('model-viewer');

  let pathIndex = 0;

  mv.addEventListener('error', () => {

    pathIndex++;

    if (pathIndex < PATHS.length) {

      mv.src = PATHS[pathIndex];

    } else {

      const note = card.querySelector('.note');

      note.style.display = 'block';

      note.textContent =
        'pizza.glb not found in your repo.';

    }

  });


  // ====================================================
  // CAMERA BUTTON
  // ====================================================

  card.querySelector('.camopen').addEventListener(
    'click',
    async () => {

      /*
       * IMPORTANT:
       *
       * We do NOT use getUserMedia().
       *
       * Instead we trigger model-viewer's
       * native AR experience.
       *
       * This allows the browser to use
       * world tracking / surface detection.
       */

      if (!mv.canActivateAR) {

        alert(
          'AR is not supported on this device/browser. ' +
          'Please try Chrome on a supported Android device.'
        );

        return;
      }

      try {

        await mv.activateAR();

      } catch (error) {

        console.error(
          'AR could not start:',
          error
        );

        alert(
          'Could not start AR. ' +
          'Please allow camera access and make sure the site is HTTPS.'
        );

      }

    }
  );

});


// ======================================================
// OPTIONAL: AR STATUS EVENTS
// ======================================================

document.querySelectorAll('model-viewer').forEach(mv => {

  mv.addEventListener(
    'ar-status',
    event => {

      console.log(
        'AR status:',
        event.detail.status
      );

    }
  );

});

</script>

</body>
</html>
