<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>AR Menu v7</title>

<!-- Normal menu 3D preview -->
<script type="module"
src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#fff8f0;
  color:#2b1d14
}

header{
  padding:26px 16px 6px;
  text-align:center
}

h1{
  margin:0;
  font-size:1.6rem
}

header p{
  margin:6px 0 0;
  color:#8a7566;
  font-size:.92rem
}

main{
  max-width:900px;
  margin:0 auto;
  padding:16px;
  display:grid;
  gap:18px;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr))
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px #0002
}

.card model-viewer{
  width:100%;
  height:270px;
  background:#fff3e6
}

.info{
  padding:14px 16px 16px
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline
}

.row h2{
  margin:0;
  font-size:1.1rem
}

.price{
  font-weight:700;
  color:#d9381e
}

.info p{
  margin:6px 0 10px;
  color:#8a7566;
  font-size:.9rem
}

.btn{
  background:#d9381e;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-size:.95rem;
  font-weight:600;
  width:100%;
  cursor:pointer
}

.note{
  margin:8px 16px 0;
  font-size:.8rem;
  color:#b00020;
  display:none
}


/* =========================================
   REAL AR SCREEN
========================================= */

#ar{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  background:transparent;
  overflow:hidden;
}

#ar canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}


/* =========================================
   CLOSE
========================================= */

#ar-close{
  position:absolute;

  top:calc(
    14px + env(safe-area-inset-top)
  );

  right:14px;

  z-index:20;

  background:#fff;
  color:#2b1d14;

  border:0;
  border-radius:999px;

  padding:10px 16px;

  font-size:.95rem;
  font-weight:700;

  cursor:pointer;

  box-shadow:0 3px 12px #0003;
}


/* =========================================
   PLACE BUTTON
========================================= */

#ar-place{

  position:absolute;

  left:50%;

  bottom:
    calc(
      25px +
      env(safe-area-inset-bottom)
    );

  transform:translateX(-50%);

  z-index:20;

  background:#d9381e;

  color:#fff;

  border:0;

  border-radius:999px;

  padding:13px 25px;

  font-size:.95rem;

  font-weight:700;

  display:none;

  box-shadow:0 4px 15px #0004;

}


/* =========================================
   TIP
========================================= */

#ar-tip{

  position:absolute;

  left:20px;
  right:20px;

  bottom:
    calc(
      82px +
      env(safe-area-inset-bottom)
    );

  z-index:20;

  text-align:center;

  color:#fff;

  font-size:.9rem;

  text-shadow:
    0 1px 4px #000,
    0 1px 8px #000;

  pointer-events:none;

}


/* =========================================
   RETICLE
========================================= */

#reticle{

  position:absolute;

  left:50%;
  top:50%;

  width:70px;
  height:70px;

  transform:
    translate(-50%,-50%);

  z-index:10;

  border:
    2px solid
    rgba(255,255,255,.9);

  border-radius:50%;

  display:none;

  pointer-events:none;

}

#reticle::after{

  content:"";

  position:absolute;

  width:6px;
  height:6px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:#fff;

}


/* =========================================
   ERROR
========================================= */

#ar-error{

  position:absolute;

  left:20px;
  right:20px;

  top:50%;

  transform:
    translateY(-50%);

  z-index:30;

  background:#fff;

  border-radius:18px;

  padding:22px;

  text-align:center;

  box-shadow:0 8px 30px #0005;

  display:none;

}

#ar-error h3{

  margin:0 0 8px;

}

#ar-error p{

  margin:0;

  color:#8a7566;

  font-size:.9rem;

  line-height:1.5;

}

</style>
</head>


<body>


<header>

  <h1>
    🍕 Our Menu (v3)
  </h1>

  <p>
    See the dish on your table through your camera. No app needed.
  </p>

</header>


<main id="menu"></main>


<!-- =========================================
     AR UI
========================================= -->

<div id="ar">

  <button id="ar-close">
    ✕ Close
  </button>


  <div id="reticle"></div>


  <button id="ar-place">
    ✓ Place Pizza
  </button>


  <div id="ar-tip">
    Move your phone slowly to find a table
  </div>


  <div id="ar-error">

    <h3 id="error-title">
      AR unavailable
    </h3>

    <p id="error-text">
      Your browser could not start
      world-tracked AR.
    </p>

  </div>

</div>



<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>



<script type="module">

import * as THREE from
  "three";

import {
  GLTFLoader
} from
  "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   MENU
===================================================== */

const ITEMS = [

  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },

  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }

];


const PATHS = [

  "pizza.glb",

  "assets/pizza.glb",

  "models/pizza.glb"

];


/* =====================================================
   MENU HTML
===================================================== */

document.getElementById("menu").innerHTML =

ITEMS.map((item,index) => `

  <article class="card">

    <model-viewer

      id="preview-${index}"

      src="${PATHS[0]}"

      alt="${item.name}"

      camera-controls

      auto-rotate

      shadow-intensity="1"

      touch-action="pan-y"

      loading="lazy"

    ></model-viewer>


    <div class="note"></div>


    <div class="info">

      <div class="row">

        <h2>
          ${item.name}
        </h2>

        <span class="price">
          ${item.price}
        </span>

      </div>


      <p>
        ${item.desc}
      </p>


      <button
        class="btn camopen"
        data-index="${index}">

        📷 View with camera

      </button>

    </div>

  </article>

`).join("");


/* =====================================================
   NORMAL MODEL FALLBACK
===================================================== */

document
.querySelectorAll(".card")
.forEach((card,index) => {

  const model =
    card.querySelector("model-viewer");

  let pathIndex = 0;


  model.addEventListener(
    "error",
    () => {

      pathIndex++;

      if(
        pathIndex <
        PATHS.length
      ){

        model.src =
          PATHS[pathIndex];

      }
      else{

        const note =
          card.querySelector(".note");

        note.style.display =
          "block";

        note.textContent =
          "pizza.glb not found.";

      }

    }
  );


  card
  .querySelector(".camopen")
  .addEventListener(
    "click",
    () => {

      startAR(PATHS[0]);

    }
  );

});


/* =====================================================
   AR ELEMENTS
===================================================== */

const ar =
  document.getElementById("ar");

const arClose =
  document.getElementById("ar-close");

const arPlace =
  document.getElementById("ar-place");

const arTip =
  document.getElementById("ar-tip");

const reticle =
  document.getElementById("reticle");

const arError =
  document.getElementById("ar-error");

const errorTitle =
  document.getElementById("error-title");

const errorText =
  document.getElementById("error-text");


/* =====================================================
   THREE VARIABLES
===================================================== */

let renderer = null;

let scene = null;

let camera = null;

let controller = null;

let pizza = null;

let reticleMesh = null;

let xrSession = null;

let referenceSpace = null;

let viewerSpace = null;

let hitTestSource = null;

let hitTestRequested = false;

let currentHit = null;

let pizzaPlaced = false;

let pizzaAnchor = null;


/* =====================================================
   THREE INITIALIZATION
===================================================== */

function initializeThree(){

  scene =
    new THREE.Scene();


  camera =
    new THREE.PerspectiveCamera();


  const canvas =
    document.createElement("canvas");


  renderer =
    new THREE.WebGLRenderer({

      canvas,

      alpha:true,

      antialias:true

    });


  renderer.xr.enabled =
    true;


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio || 1,
      2
    )
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  renderer.outputColorSpace =
    THREE.SRGBColorSpace;


  renderer.shadowMap.enabled =
    true;


  ar.appendChild(canvas);


  /* -----------------------------------------
     LIGHT
  ----------------------------------------- */

  const hemisphere =
    new THREE.HemisphereLight(
      0xffffff,
      0x777777,
      2
    );

  scene.add(
    hemisphere
  );


  const directional =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  directional.position.set(
    2,
    5,
    2
  );

  directional.castShadow =
    true;

  scene.add(
    directional
  );


  /* -----------------------------------------
     RETICLE
  ----------------------------------------- */

  const geometry =
    new THREE.RingGeometry(
      0.08,
      0.1,
      32
    );


  geometry.rotateX(
    -Math.PI / 2
  );


  const material =
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });


  reticleMesh =
    new THREE.Mesh(
      geometry,
      material
    );


  reticleMesh.matrixAutoUpdate =
    false;


  reticleMesh.visible =
    false;


  scene.add(
    reticleMesh
  );


  /* -----------------------------------------
     TOUCH / SELECT
  ----------------------------------------- */

  controller =
    renderer.xr.getController(0);


  controller.addEventListener(
    "select",
    placePizza
  );


  scene.add(
    controller
  );

}


/* =====================================================
   LOAD MODEL
===================================================== */

function loadPizza(src){

  return new Promise(
    (resolve,reject) => {

      const loader =
        new GLTFLoader();


      loader.load(

        src,

        gltf => {

          pizza =
            gltf.scene;


          pizza.visible =
            false;


          pizza.matrixAutoUpdate =
            false;


          pizza.traverse(
            object => {

              if(
                object.isMesh
              ){

                object.castShadow =
                  true;

                object.receiveShadow =
                  true;

              }

            }
          );


          scene.add(
            pizza
          );


          resolve();

        },

        undefined,

        error => {

          reject(error);

        }

      );

    }
  );

}


/* =====================================================
   CHECK WEBXR
===================================================== */

async function canUseAR(){

  if(
    !navigator.xr
  ){

    return false;

  }


  try{

    return await
      navigator.xr.isSessionSupported(
        "immersive-ar"
      );

  }
  catch{

    return false;

  }

}


/* =====================================================
   START AR
===================================================== */

async function startAR(src){

  hideError();


  const supported =
    await canUseAR();


  if(!supported){

    showError(
      "Browser AR unavailable",

      "This browser is not exposing immersive AR. Try the latest Chrome on a supported Android device."
    );

    return;

  }


  try{

    initializeThree();


    await loadPizza(src);


    /*
     * IMPORTANT:
     *
     * hit-test is required.
     *
     * local-floor is OPTIONAL.
     *
     * anchors are OPTIONAL.
     *
     * This makes the session less restrictive.
     */

    xrSession =
      await navigator.xr.requestSession(
        "immersive-ar",
        {

          requiredFeatures:[
            "hit-test"
          ],

          optionalFeatures:[
            "local-floor",
            "anchors",
            "dom-overlay"
          ],

          domOverlay:{
            root:ar
          }

        }
      );


    xrSession.addEventListener(
      "end",
      endAR
    );


    /*
     * Try local-floor first.
     * Fall back to local.
     */

    try{

      referenceSpace =
        await xrSession.requestReferenceSpace(
          "local-floor"
        );

    }
    catch{

      referenceSpace =
        await xrSession.requestReferenceSpace(
          "local"
        );

    }


    viewerSpace =
      await xrSession.requestReferenceSpace(
        "viewer"
      );


    await renderer.xr.setSession(
      xrSession
    );


    ar.style.display =
      "block";


    reticle.style.display =
      "block";


    arTip.textContent =
      "Move your phone slowly to find a table";


    arPlace.style.display =
      "none";


    pizzaPlaced =
      false;


    currentHit =
      null;


    hitTestRequested =
      false;


    renderer.setAnimationLoop(
      render
    );


  }
  catch(error){

    console.error(
      "WebXR error:",
      error
    );


    showError(
      "AR could not start",

      error.name +
      ": " +
      (error.message ||
       "Unknown error")
    );


    cleanup();

  }

}


/* =====================================================
   REQUEST HIT TEST
===================================================== */

async function requestHitTest(){

  if(
    hitTestRequested ||
    !xrSession ||
    !viewerSpace
  ){

    return;

  }


  hitTestRequested =
    true;


  try{

    hitTestSource =
      await xrSession.requestHitTestSource({

        space:viewerSpace

      });

  }
  catch(error){

    console.error(
      "Hit test failed:",
      error
    );

    hitTestSource =
      null;

  }

}


/* =====================================================
   AR FRAME
===================================================== */

function render(
  time,
  frame
){

  if(
    !frame ||
    !xrSession
  ){

    return;

  }


  requestHitTest();


  /*
   * ======================================
   * BEFORE PLACEMENT
   * ======================================
   */

  if(
    !pizzaPlaced &&
    hitTestSource
  ){

    const results =
      frame.getHitTestResults(
        hitTestSource
      );


    if(
      results.length > 0
    ){

      const hit =
        results[0];


      const pose =
        hit.getPose(
          referenceSpace
        );


      if(pose){

        currentHit =
          hit;


        /*
         * Reticle = real surface
         */

        reticleMesh.visible =
          true;


        reticleMesh.matrix.fromArray(
          pose.transform.matrix
        );


        /*
         * Preview pizza at surface.
         */

        pizza.visible =
          true;


        pizza.matrix.fromArray(
          pose.transform.matrix
        );


        arPlace.style.display =
          "block";


        arTip.textContent =
          "Tap the table to place the pizza";

      }

    }
    else{

      currentHit =
        null;


      reticleMesh.visible =
        false;


      pizza.visible =
        false;


      arPlace.style.display =
        "none";


      arTip.textContent =
        "Move your phone slowly to find a table";

    }

  }


  /*
   * ======================================
   * AFTER PLACEMENT
   * ======================================
   *
   * NEVER update pizza from camera.
   */

  if(
    pizzaPlaced &&
    pizzaAnchor
  ){

    const anchorPose =
      frame.getPose(
        pizzaAnchor.anchorSpace,
        referenceSpace
      );


    if(anchorPose){

      pizza.matrix.fromArray(
        anchorPose.transform.matrix
      );

      pizza.visible =
        true;

    }

  }


  renderer.render(
    scene,
    camera
  );

}


/* =====================================================
   PLACE PIZZA
===================================================== */

async function placePizza(){

  if(
    pizzaPlaced ||
    !currentHit ||
    !referenceSpace
  ){

    return;

  }


  try{

    /*
     * ======================================
     * CREATE REAL WORLD ANCHOR
     * ======================================
     */

    if(
      typeof currentHit.createAnchor ===
      "function"
    ){

      try{

        pizzaAnchor =
          await currentHit.createAnchor();

      }
      catch(error){

        console.log(
          "Anchor creation unavailable:",
          error
        );

        pizzaAnchor =
          null;

      }

    }


    /*
     * If anchors are supported,
     * continuously use the anchor.
     *
     * If not, keep the hit-test pose
     * in the XR reference space.
     */

    if(
      pizzaAnchor
    ){

      pizzaPlaced =
        true;


      reticleMesh.visible =
        false;


      arPlace.style.display =
        "none";


      arTip.textContent =
        "🍕 Placed — walk around it";


    }
    else{

      /*
       * Fallback for browsers that support
       * hit-test but don't expose anchors.
       *
       * The transform is still in the
       * XR world reference space.
       */

      const pose =
        currentHit.getPose(
          referenceSpace
        );


      if(
        pose
      ){

        pizza.matrix.fromArray(
          pose.transform.matrix
        );


        pizza.matrixAutoUpdate =
          false;


        pizza.visible =
          true;


        pizzaPlaced =
          true;


        reticleMesh.visible =
          false;


        arPlace.style.display =
          "none";


        arTip.textContent =
          "🍕 Placed — walk around it";

      }

    }

  }
  catch(error){

    console.error(
      "Placement error:",
      error
    );

  }

}


/* =====================================================
   PLACE BUTTON
===================================================== */

arPlace.addEventListener(
  "click",
  placePizza
);


/* =====================================================
   CLOSE
===================================================== */

arClose.addEventListener(
  "click",
  async () => {

    if(
      xrSession
    ){

      try{

        await xrSession.end();

      }
      catch(error){

        console.log(error);

      }

    }

  }
);


/* =====================================================
   SESSION END
===================================================== */

function endAR(){

  cleanup();

}


/* =====================================================
   CLEANUP
===================================================== */

function cleanup(){

  if(
    renderer
  ){

    renderer.setAnimationLoop(
      null
    );

  }


  if(
    pizzaAnchor
  ){

    try{

      pizzaAnchor.delete();

    }
    catch{}

  }


  pizzaAnchor =
    null;


  hitTestSource =
    null;


  hitTestRequested =
    false;


  currentHit =
    null;


  pizzaPlaced =
    false;


  xrSession =
    null;


  if(
    pizza &&
    scene
  ){

    scene.remove(
      pizza
    );

  }


  pizza =
    null;


  ar.style.display =
    "none";


  arPlace.style.display =
    "none";


  reticle.style.display =
    "none";


  arError.style.display =
    "none";

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  title,
  message
){

  ar.style.display =
    "block";


  arError.style.display =
    "block";


  errorTitle.textContent =
    title;


  errorText.textContent =
    message;


  arTip.textContent =
    "";


  reticle.style.display =
    "none";


  arPlace.style.display =
    "none";

}


function hideError(){

  arError.style.display =
    "none";

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    if(
      renderer
    ){

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }

  }
);

</script>

</body>
</html>
