<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#050505">

  <title>AR Menu</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">

    <div
      id="restaurantName"
      class="brand">
      NEMPAT
    </div>

    <p id="restaurantTagline">
      Experience your food in 3D
    </p>

  </header>


  <main class="menu">

    <div class="section-heading">

      <span>EXPLORE</span>

      <h1>
        Our Menu
      </h1>

    </div>

    <div id="categories"></div>

  </main>


  <div
    id="loading"
    class="screen-message">

    Loading menu...

  </div>


  <div
    id="error"
    class="screen-message hidden">

    Unable to load menu.

  </div>


  <script src="app.js"></script>

</body>

</html>
