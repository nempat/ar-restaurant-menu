<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Our Menu</title>

  <!-- Google Model Viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .menu {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .food-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 18px;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    model-viewer {
      width: 100%;
      height: 330px;
      background: #eee;
      border-radius: 12px;
      overflow: hidden;
    }

    .ar-button {
      background: #111;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;

      position: absolute;
      bottom: 16px;
      right: 16px;
    }

    .ar-button:active {
      transform: scale(0.97);
    }

    .fallback-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    🍕 Our Menu
  </header>

  <main class="menu">

    <!-- PIZZA -->
    <div class="card">

      <img
        class="food-image"
        src="pizza.jpg"
        alt="Margherita Pizza"
      >

      <div class="content">

        <div class="name">
          Margherita Pizza
        </div>

        <div class="price">
          ₹349
        </div>

        <!-- REAL AR MODEL -->
        <model-viewer
          id="pizzaModel"
          src="pizza.glb"

          alt="3D Margherita Pizza"

          ar

          ar-modes="webxr scene-viewer quick-look"

          ar-placement="floor"

          ar-scale="fixed"

          camera-controls

          touch-action="pan-y"

          shadow-intensity="1"

          exposure="1"

          interaction-prompt="auto"

          loading="eager"
        >

          <!-- AR BUTTON -->
          <button
            slot="ar-button"
            class="ar-button"
          >
            📱 View in AR
          </button>

        </model-viewer>

        <div class="status">
          Place the pizza on your table in AR
        </div>

      </div>
    </div>

  </main>

</body>
</html>
