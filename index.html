<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>AR Menu v5</title>


<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:system-ui,sans-serif;
  background:#fff8f0;
  color:#2b1d14;
}

header{
  padding:26px 16px 6px;
  text-align:center;
}

h1{
  margin:0;
  font-size:1.6rem;
}

header p{
  margin:6px 0 0;
  color:#8a7566;
  font-size:.92rem;
}

main{
  max-width:900px;
  margin:0 auto;
  padding:16px;
  display:grid;
  gap:18px;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px #0002;
}

.card model-viewer{
  width:100%;
  height:270px;
  background:#fff3e6;
}

.info{
  padding:14px 16px 16px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}

.row h2{
  margin:0;
  font-size:1.1rem;
}

.price{
  font-weight:700;
  color:#d9381e;
}

.info p{
  margin:6px 0 10px;
  color:#8a7566;
  font-size:.9rem;
}

.btn{
  background:#d9381e;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-size:.95rem;
  font-weight:600;
  width:100%;
  cursor:pointer;
}

.ar-btn{
  position:absolute;
  bottom:12px;
  right:12px;
  background:#2b1d14;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 16px;
  font-size:.9rem;
  font-weight:600;
}

.note{
  margin:8px 16px 0;
  font-size:.8rem;
  color:#b00020;
  display:none;
}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

#cam{

  position:fixed;

  inset:0;

  width:100vw;
  height:100dvh;

  z-index:99;

  background:#000;

  display:none;

  overflow:hidden;

  /*
   * VERY IMPORTANT FOR MOBILE
   */
  touch-action:none;

  overscroll-behavior:none;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}


/* =====================================================
   CAMERA VIDEO
===================================================== */

#cam video{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  pointer-events:none;

  user-select:none;

  -webkit-user-select:none;
}


/* =====================================================
   PIZZA
===================================================== */

#fallback-model{

  position:absolute;

  width:280px;
  height:280px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(0deg)
    scale(1);

  background:transparent;

  --poster-color:transparent;
  --progress-bar-color:transparent;

  display:none;

  /*
   * DON'T let model-viewer handle
   * touch gestures.
   */
  pointer-events:none;

  touch-action:none;

  user-select:none;

  -webkit-user-select:none;
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

#camx{

  position:absolute;

  top:14px;
  right:14px;

  z-index:20;

  background:#fff;

  border:0;

  border-radius:999px;

  padding:10px 16px;

  font-weight:700;

  cursor:pointer;

  touch-action:manipulation;
}


/* =====================================================
   PLACE BUTTON
===================================================== */

#placeBtn{

  position:absolute;

  bottom:65px;

  left:50%;

  transform:translateX(-50%);

  z-index:20;

  background:#d9381e;

  color:#fff;

  border:0;

  border-radius:999px;

  padding:13px 23px;

  font-size:.95rem;

  font-weight:700;

  display:none;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   TIP
===================================================== */

#camtip{

  position:absolute;

  bottom:22px;

  left:0;
  right:0;

  text-align:center;

  color:#fff;

  font-size:.9rem;

  text-shadow:0 1px 4px #000;

  z-index:15;

  pointer-events:none;

  padding:0 15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  #fallback-model{

    width:250px;
    height:250px;

  }

  #placeBtn{

    bottom:70px;

    padding:14px 24px;

    font-size:1rem;

  }

  #camx{

    top:16px;
    right:16px;

    padding:11px 17px;

  }

}

</style>

</head>


<body>


<header>

  <h1>
    🍕 Our Menu (v3)
  </h1>

  <p>
    See the dish on your table through your camera. No app needed.
  </p>

</header>


<main id="menu"></main>


<!-- ==================================================
     CAMERA FALLBACK
================================================== -->

<div id="cam">

  <video
    id="camv"
    autoplay
    playsinline
    muted>
  </video>


  <model-viewer

    id="fallback-model"

    interaction-prompt="none"

    shadow-intensity="1"

    touch-action="none">

  </model-viewer>


  <button id="placeBtn">
    ✓ Place Pizza
  </button>


  <button id="camx">
    ✕ Close
  </button>


  <div id="camtip">

    Drag • Pinch • Rotate,
    then tap Place Pizza

  </div>

</div>



<script>

/* =====================================================
   MENU
===================================================== */

const ITEMS = [

  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },

  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }

];


const PATHS = [

  'pizza.glb',

  'assets/pizza.glb',

  'models/pizza.glb'

];


/* =====================================================
   CREATE MENU
===================================================== */

document.getElementById('menu').innerHTML =

ITEMS.map((item,index) => `

  <article class="card">

    <model-viewer

      id="model-${index}"

      src="${PATHS[0]}"

      alt="${item.name}"

      ar

      ar-modes="webxr"

      ar-placement="floor"

      ar-scale="fixed"

      camera-controls

      auto-rotate

      shadow-intensity="1"

      touch-action="pan-y"

      interaction-prompt="auto"

      loading="lazy">

      <button
        slot="ar-button"
        class="ar-btn">

        📱 Place on surface

      </button>

    </model-viewer>


    <div class="note"></div>


    <div class="info">

      <div class="row">

        <h2>
          ${item.name}
        </h2>

        <span class="price">
          ${item.price}
        </span>

      </div>


      <p>
        ${item.desc}
      </p>


      <button
        class="btn camopen"
        data-index="${index}">

        📷 View with camera

      </button>

    </div>

  </article>

`).join('');


/* =====================================================
   MODEL FALLBACK
===================================================== */

document
.querySelectorAll('.card')
.forEach((card,index) => {

  const mv =
    card.querySelector('model-viewer');

  let pathIndex = 0;


  mv.addEventListener(
    'error',
    () => {

      pathIndex++;


      if(pathIndex < PATHS.length){

        mv.src =
          PATHS[pathIndex];

      }

      else{

        const note =
          card.querySelector('.note');

        note.style.display =
          'block';

        note.textContent =
          'pizza.glb not found in your repo.';

      }

    }
  );


  card
  .querySelector('.camopen')
  .addEventListener(
    'click',
    () => {

      openAR(mv.src);

    }
  );

});


/* =====================================================
   CAMERA ELEMENTS
===================================================== */

const cam =
  document.getElementById('cam');

const camv =
  document.getElementById('camv');

const fallbackModel =
  document.getElementById(
    'fallback-model'
  );

const placeBtn =
  document.getElementById(
    'placeBtn'
  );


let stream = null;


/* =====================================================
   PIZZA STATE
===================================================== */

let pizzaLocked = false;


/*
 * Pizza position
 */

let pizzaX = 0;
let pizzaY = 0;


/*
 * Pizza size
 */

let pizzaScale = 1;


/*
 * Pizza rotation
 */

let pizzaRotation = 0;


/* =====================================================
   OPEN AR
===================================================== */

async function openAR(src){

  const webxrSupported =
    await checkWebXR();


  if(webxrSupported){

    const models =
      document.querySelectorAll(
        'model-viewer'
      );


    for(const model of models){

      if(model.src === src){

        try{

          await model.activateAR();

          return;

        }

        catch(error){

          console.log(
            'WebXR failed:',
            error
          );

        }

      }

    }

  }


  /*
   * Browser camera fallback
   */

  openCameraFallback(src);

}


/* =====================================================
   CHECK WEBXR
===================================================== */

async function checkWebXR(){

  if(!navigator.xr){

    return false;

  }


  try{

    return await navigator.xr.isSessionSupported(
      'immersive-ar'
    );

  }

  catch(error){

    console.log(
      'WebXR detection failed:',
      error
    );

    return false;

  }

}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

async function openCameraFallback(src){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:'environment'
          }
        },

        audio:false

      });


    camv.srcObject =
      stream;


    fallbackModel.src =
      src;


    /*
     * Center pizza
     */

    pizzaX =
      window.innerWidth / 2;

    pizzaY =
      window.innerHeight / 2;


    pizzaScale =
      1;


    pizzaRotation =
      0;


    pizzaLocked =
      false;


    /*
     * Reset button
     */

    placeBtn.textContent =
      '✓ Place Pizza';


    /*
     * Apply position
     */

    updatePizza();


    /*
     * Show camera
     */

    cam.style.display =
      'block';


    fallbackModel.style.display =
      'block';


    placeBtn.style.display =
      'block';


    document.getElementById(
      'camtip'
    ).textContent =
      'Drag • Pinch • Rotate, then tap Place Pizza';

  }

  catch(error){

    console.error(error);


    alert(
      'Camera could not start. ' +
      'Please allow camera permission ' +
      'and make sure this website uses HTTPS.'
    );

  }

}


/* =====================================================
   UPDATE PIZZA
===================================================== */

function updatePizza(){

  fallbackModel.style.left =
    pizzaX + 'px';


  fallbackModel.style.top =
    pizzaY + 'px';


  fallbackModel.style.transform =

    `
      translate(-50%,-50%)
      rotate(${pizzaRotation}deg)
      scale(${pizzaScale})
    `;

}


/* =====================================================
   TOUCH STATE
===================================================== */

/*
 * IMPORTANT:
 *
 * These listeners are attached to #cam,
 * NOT model-viewer.
 *
 * This makes mobile Chrome much
 * more reliable.
 */

const touches =
  new Map();


let gesture = null;


/* =====================================================
   DISTANCE
===================================================== */

function getDistance(a,b){

  const dx =
    b.x - a.x;

  const dy =
    b.y - a.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =====================================================
   ANGLE
===================================================== */

function getAngle(a,b){

  return Math.atan2(

    b.y - a.y,

    b.x - a.x

  ) * 180 / Math.PI;

}


/* =====================================================
   CENTER
===================================================== */

function getCenter(a,b){

  return {

    x:
      (a.x + b.x) / 2,

    y:
      (a.y + b.y) / 2

  };

}


/* =====================================================
   TOUCH START
===================================================== */

cam.addEventListener(

  'pointerdown',

  function(event){

    /*
     * Don't handle buttons.
     */

    if(
      event.target === placeBtn ||
      event.target === document.getElementById('camx')
    ){

      return;

    }


    /*
     * Don't edit locked pizza.
     */

    if(pizzaLocked){

      return;

    }


    event.preventDefault();


    touches.set(

      event.pointerId,

      {
        x:event.clientX,
        y:event.clientY
      }

    );


    /*
     * ONE FINGER
     */

    if(touches.size === 1){

      const p =
        [...touches.values()][0];


      gesture = {

        type:'move',

        startX:p.x,
        startY:p.y,

        pizzaX:pizzaX,
        pizzaY:pizzaY

      };

    }


    /*
     * TWO FINGERS
     */

    else if(touches.size === 2){

      const pts =
        [...touches.values()];


      const a =
        pts[0];

      const b =
        pts[1];


      const c =
        getCenter(a,b);


      gesture = {

        type:'transform',

        centerX:c.x,
        centerY:c.y,

        distance:
          getDistance(a,b),

        angle:
          getAngle(a,b),

        pizzaX:pizzaX,
        pizzaY:pizzaY,

        pizzaScale:pizzaScale,

        pizzaRotation:
          pizzaRotation

      };

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   TOUCH MOVE
===================================================== */

cam.addEventListener(

  'pointermove',

  function(event){

    if(pizzaLocked){

      return;

    }


    if(!touches.has(
      event.pointerId
    )){

      return;

    }


    event.preventDefault();


    /*
     * Update finger
     */

    touches.set(

      event.pointerId,

      {
        x:event.clientX,
        y:event.clientY
      }

    );


    /*
     * ================================================
     * ONE FINGER → MOVE
     * ================================================
     */

    if(

      touches.size === 1 &&

      gesture &&

      gesture.type === 'move'

    ){

      const p =
        [...touches.values()][0];


      pizzaX =

        gesture.pizzaX +

        (
          p.x -
          gesture.startX
        );


      pizzaY =

        gesture.pizzaY +

        (
          p.y -
          gesture.startY
        );


      updatePizza();


      return;

    }


    /*
     * ================================================
     * TWO FINGERS
     * ================================================
     */

    if(

      touches.size === 2 &&

      gesture &&

      gesture.type === 'transform'

    ){

      const pts =
        [...touches.values()];


      const a =
        pts[0];

      const b =
        pts[1];


      const c =
        getCenter(a,b);


      /*
       * MOVE
       */

      pizzaX =

        gesture.pizzaX +

        (
          c.x -
          gesture.centerX
        );


      pizzaY =

        gesture.pizzaY +

        (
          c.y -
          gesture.centerY
        );


      /*
       * PINCH
       */

      const currentDistance =
        getDistance(a,b);


      if(
        gesture.distance > 0
      ){

        pizzaScale =

          gesture.pizzaScale *

          (
            currentDistance /
            gesture.distance
          );

      }


      /*
       * Limit scale
       */

      pizzaScale =

        Math.max(

          0.35,

          Math.min(
            2.5,
            pizzaScale
          )

        );


      /*
       * ROTATE
       */

      const currentAngle =
        getAngle(a,b);


      pizzaRotation =

        gesture.pizzaRotation +

        (
          currentAngle -
          gesture.angle
        );


      updatePizza();

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   TOUCH END
===================================================== */

function pointerEnd(event){

  touches.delete(
    event.pointerId
  );


  /*
   * No fingers
   */

  if(touches.size === 0){

    gesture = null;

    return;

  }


  /*
   * One finger remains.
   *
   * Start a fresh drag
   * without jumping.
   */

  if(touches.size === 1){

    const p =
      [...touches.values()][0];


    gesture = {

      type:'move',

      startX:p.x,
      startY:p.y,

      pizzaX:pizzaX,
      pizzaY:pizzaY

    };

  }

}


cam.addEventListener(
  'pointerup',
  pointerEnd
);


cam.addEventListener(
  'pointercancel',
  pointerEnd
);


/* =====================================================
   PLACE / MOVE
===================================================== */

placeBtn.addEventListener(

  'click',

  function(event){

    event.preventDefault();

    event.stopPropagation();


    /*
     * ================================================
     * PLACE
     * ================================================
     */

    if(!pizzaLocked){

      pizzaLocked =
        true;


      touches.clear();

      gesture =
        null;


      placeBtn.textContent =
        '↔ Move Pizza';


      document.getElementById(
        'camtip'
      ).textContent =
        '✓ Pizza fixed · Tap Move Pizza to reposition';


      return;

    }


    /*
     * ================================================
     * MOVE AGAIN
     * ================================================
     */

    pizzaLocked =
      false;


    placeBtn.textContent =
      '✓ Place Pizza';


    document.getElementById(
      'camtip'
    ).textContent =
      'Drag • Pinch • Rotate, then tap Place Pizza';

  }

);


/* =====================================================
   CLOSE
===================================================== */

document
.getElementById('camx')
.addEventListener(

  'click',

  function(event){

    event.preventDefault();

    event.stopPropagation();

    closeCam();

  }

);


function closeCam(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  stream =
    null;


  camv.srcObject =
    null;


  fallbackModel.style.display =
    'none';


  placeBtn.style.display =
    'none';


  pizzaLocked =
    false;


  touches.clear();


  gesture =
    null;


  cam.style.display =
    'none';

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  'pagehide',
  closeCam
);


/* =====================================================
   SCREEN ROTATION / RESIZE
===================================================== */

window.addEventListener(
  'resize',
  function(){

    if(
      cam.style.display !== 'none'
    ){

      /*
       * Keep pizza roughly in
       * the same relative position.
       */

      pizzaX =
        Math.min(
          pizzaX,
          window.innerWidth
        );


      pizzaY =
        Math.min(
          pizzaY,
          window.innerHeight
        );


      updatePizza();

    }

  }
);

</script>

</body>
</html>
