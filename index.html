<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>AR Menu v5</title>


<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:system-ui,sans-serif;
  background:#fff8f0;
  color:#2b1d14;
}


/* =====================================================
   HEADER
===================================================== */

header{
  padding:26px 16px 6px;
  text-align:center;
}

h1{
  margin:0;
  font-size:1.6rem;
}

header p{
  margin:6px 0 0;
  color:#8a7566;
  font-size:.92rem;
}


/* =====================================================
   MENU
===================================================== */

main{
  max-width:900px;
  margin:0 auto;
  padding:16px;
  display:grid;
  gap:18px;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px #0002;
}

.card model-viewer{
  width:100%;
  height:270px;
  background:#fff3e6;
}

.info{
  padding:14px 16px 16px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}

.row h2{
  margin:0;
  font-size:1.1rem;
}

.price{
  font-weight:700;
  color:#d9381e;
}

.info p{
  margin:6px 0 10px;
  color:#8a7566;
  font-size:.9rem;
}

.btn{
  background:#d9381e;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-size:.95rem;
  font-weight:600;
  width:100%;
  cursor:pointer;
}

.ar-btn{
  position:absolute;
  bottom:12px;
  right:12px;
  background:#2b1d14;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 16px;
  font-size:.9rem;
  font-weight:600;
}

.note{
  margin:8px 16px 0;
  font-size:.8rem;
  color:#b00020;
  display:none;
}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

#cam{

  position:fixed;

  inset:0;

  width:100vw;
  height:100dvh;

  z-index:99;

  background:#000;

  display:none;

  overflow:hidden;

  touch-action:none;

  overscroll-behavior:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}


/* =====================================================
   CAMERA VIDEO
===================================================== */

#camv{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  pointer-events:none;

  z-index:0;
}


/* =====================================================
   FALLBACK PIZZA
===================================================== */

#fallback-model{

  position:absolute;

  width:280px;
  height:280px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:transparent;

  --poster-color:transparent;
  --progress-bar-color:transparent;

  pointer-events:none;

  z-index:2;

  display:none;
}


/* =====================================================
   FULL SCREEN GESTURE LAYER

   IMPORTANT:
   model-viewer does NOT receive touch events.

   This layer receives all gestures.
===================================================== */

#gestureLayer{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  z-index:4;

  background:transparent;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  cursor:grab;
}

#gestureLayer:active{
  cursor:grabbing;
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

#camx{

  position:absolute;

  top:14px;
  right:14px;

  z-index:20;

  background:#fff;

  border:0;

  border-radius:999px;

  padding:10px 16px;

  font-weight:700;

  cursor:pointer;
}


/* =====================================================
   PLACE BUTTON
===================================================== */

#placeBtn{

  position:absolute;

  bottom:65px;

  left:50%;

  transform:translateX(-50%);

  z-index:20;

  background:#d9381e;

  color:#fff;

  border:0;

  border-radius:999px;

  padding:12px 22px;

  font-size:.95rem;

  font-weight:700;

  display:none;

  cursor:pointer;

  white-space:nowrap;
}


/* =====================================================
   CAMERA TIP
===================================================== */

#camtip{

  position:absolute;

  bottom:22px;

  left:0;
  right:0;

  text-align:center;

  color:#fff;

  font-size:.9rem;

  text-shadow:
    0 1px 4px #000;

  z-index:20;

  pointer-events:none;
}

</style>

</head>


<body>


<header>

  <h1>🍕 Our Menu (v3)</h1>

  <p>
    See the dish on your table through your camera.
    No app needed.
  </p>

</header>


<main id="menu"></main>


<!-- ==================================================
     CAMERA FALLBACK
================================================== -->

<div id="cam">


  <!-- CAMERA -->

  <video
    id="camv"
    autoplay
    playsinline
    muted>
  </video>


  <!-- PIZZA -->

  <model-viewer
    id="fallback-model"
    interaction-prompt="none"
    shadow-intensity="1">

  </model-viewer>


  <!-- =================================================
       FULL SCREEN TOUCH LAYER

       ALL mobile gestures happen here.
  ================================================== -->

  <div id="gestureLayer"></div>


  <!-- PLACE / MOVE -->

  <button id="placeBtn">
    ✓ Place Pizza
  </button>


  <!-- CLOSE -->

  <button id="camx">
    ✕ Close
  </button>


  <!-- TIP -->

  <div id="camtip">
    Drag • Pinch • Rotate, then tap Place Pizza
  </div>


</div>



<script>


/* =====================================================
   MENU
===================================================== */

const ITEMS = [

  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },

  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }

];


const PATHS = [

  'pizza.glb',

  'assets/pizza.glb',

  'models/pizza.glb'

];


/* =====================================================
   CREATE MENU
===================================================== */

document.getElementById('menu').innerHTML =

ITEMS.map((item,index) => `

  <article class="card">


    <model-viewer

      id="model-${index}"

      src="${PATHS[0]}"

      alt="${item.name}"

      ar

      ar-modes="webxr"

      ar-placement="floor"

      ar-scale="fixed"

      camera-controls

      auto-rotate

      shadow-intensity="1"

      touch-action="pan-y"

      interaction-prompt="auto"

      loading="lazy"

    >


      <button
        slot="ar-button"
        class="ar-btn">

        📱 Place on surface

      </button>


    </model-viewer>


    <div class="note"></div>


    <div class="info">


      <div class="row">

        <h2>
          ${item.name}
        </h2>

        <span class="price">
          ${item.price}
        </span>

      </div>


      <p>
        ${item.desc}
      </p>


      <button
        class="btn camopen"
        data-index="${index}">

        📷 View with camera

      </button>


    </div>


  </article>

`).join('');


/* =====================================================
   MODEL FALLBACK
===================================================== */

document
.querySelectorAll('.card')
.forEach((card,index) => {


  const mv =
    card.querySelector('model-viewer');


  let pathIndex = 0;


  mv.addEventListener(
    'error',
    () => {


      pathIndex++;


      if(pathIndex < PATHS.length){

        mv.src =
          PATHS[pathIndex];

      }

      else{

        const note =
          card.querySelector('.note');


        note.style.display =
          'block';


        note.textContent =
          'pizza.glb not found in your repo.';

      }

    }
  );


  /* =================================================
     CAMERA BUTTON
  ================================================= */

  card
  .querySelector('.camopen')
  .addEventListener(
    'click',
    () => {

      openAR(mv.src);

    }
  );

});


/* =====================================================
   CAMERA ELEMENTS
===================================================== */

const cam =
  document.getElementById('cam');


const camv =
  document.getElementById('camv');


const fallbackModel =
  document.getElementById(
    'fallback-model'
  );


const gestureLayer =
  document.getElementById(
    'gestureLayer'
  );


const placeBtn =
  document.getElementById(
    'placeBtn'
  );


const camtip =
  document.getElementById(
    'camtip'
  );


let stream = null;


/* =====================================================
   PIZZA STATE
===================================================== */

let pizzaX = 0;

let pizzaY = 0;

let pizzaScale = 1;

let pizzaRotation = 0;

let pizzaLocked = false;


/* =====================================================
   GESTURE STATE
===================================================== */

let gesture = null;


/* =====================================================
   UPDATE PIZZA
===================================================== */

function updatePizza(){

  fallbackModel.style.left =
    pizzaX + 'px';


  fallbackModel.style.top =
    pizzaY + 'px';


  fallbackModel.style.transform =

    `translate(-50%,-50%)
     rotate(${pizzaRotation}deg)
     scale(${pizzaScale})`;

}


/* =====================================================
   OPEN AR
===================================================== */

async function openAR(src){


  /*
   * First try REAL WebXR AR.
   *
   * This is the only mode that can provide
   * proper world tracking in the browser.
   */

  const webxrSupported =
    await checkWebXR();


  if(webxrSupported){


    const models =
      document.querySelectorAll(
        '.card model-viewer'
      );


    for(const model of models){


      if(model.src === src){


        try{

          await model.activateAR();

          return;

        }

        catch(error){

          console.log(
            'WebXR failed:',
            error
          );

        }

      }

    }

  }


  /*
   * WebXR unavailable.
   *
   * Use camera fallback.
   */

  openCameraFallback(src);

}


/* =====================================================
   CHECK WEBXR
===================================================== */

async function checkWebXR(){


  if(!navigator.xr){

    return false;

  }


  try{

    return await
      navigator.xr.isSessionSupported(
        'immersive-ar'
      );

  }

  catch(error){

    console.log(
      'WebXR detection failed:',
      error
    );

    return false;

  }

}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

async function openCameraFallback(src){

  try{


    /*
     * Stop previous camera first.
     */

    if(stream){

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }


    /*
     * Reset pizza.
     */

    pizzaX =
      window.innerWidth / 2;


    pizzaY =
      window.innerHeight / 2;


    pizzaScale =
      1;


    pizzaRotation =
      0;


    pizzaLocked =
      false;


    gesture =
      null;


    placeBtn.textContent =
      '✓ Place Pizza';


    camtip.textContent =
      'Drag • Pinch • Rotate, then tap Place Pizza';


    /*
     * Camera permission.
     */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      alert(
        'Camera is not available. ' +
        'Please use HTTPS and a modern browser.'
      );

      return;

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:'environment'
          }
        },

        audio:false

      });


    camv.srcObject =
      stream;


    fallbackModel.src =
      src;


    /*
     * Show camera BEFORE model.
     */

    cam.style.display =
      'block';


    fallbackModel.style.display =
      'block';


    placeBtn.style.display =
      'block';


    updatePizza();


  }

  catch(error){

    console.error(
      'Camera error:',
      error
    );


    alert(
      'Camera could not start.\n\n' +
      'Please allow camera permission ' +
      'and make sure this website uses HTTPS.'
    );

  }

}


/* =====================================================
   TOUCH HELPERS
===================================================== */

function getTouchCenter(touches){

  const a = touches[0];
  const b = touches[1];

  return {

    x:
      (a.clientX + b.clientX) / 2,

    y:
      (a.clientY + b.clientY) / 2

  };

}


function getTouchDistance(touches){

  const a = touches[0];
  const b = touches[1];

  const dx =
    b.clientX - a.clientX;

  const dy =
    b.clientY - a.clientY;

  return Math.hypot(dx,dy);

}


function getTouchAngle(touches){

  const a = touches[0];
  const b = touches[1];

  const dx =
    b.clientX - a.clientX;

  const dy =
    b.clientY - a.clientY;

  return Math.atan2(dy,dx);

}


/* =====================================================
   TOUCH START

   1 finger:
   MOVE

   2 fingers:
   MOVE + PINCH + ROTATE
===================================================== */

gestureLayer.addEventListener(

  'touchstart',

  event => {


    if(pizzaLocked){

      return;

    }


    event.preventDefault();


    const touches =
      event.touches;


    /*
     * ONE FINGER
     */

    if(touches.length === 1){


      gesture = {

        type:'move',

        startX:
          touches[0].clientX,

        startY:
          touches[0].clientY,

        pizzaX:
          pizzaX,

        pizzaY:
          pizzaY

      };


      return;

    }


    /*
     * TWO OR MORE FINGERS
     */

    if(touches.length >= 2){


      const center =
        getTouchCenter(touches);


      gesture = {

        type:'transform',


        centerX:
          center.x,

        centerY:
          center.y,


        distance:
          getTouchDistance(touches),


        angle:
          getTouchAngle(touches),


        pizzaX:
          pizzaX,

        pizzaY:
          pizzaY,

        pizzaScale:
          pizzaScale,

        pizzaRotation:
          pizzaRotation

      };

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   TOUCH MOVE
===================================================== */

gestureLayer.addEventListener(

  'touchmove',

  event => {


    if(pizzaLocked){

      return;

    }


    if(!gesture){

      return;

    }


    event.preventDefault();


    const touches =
      event.touches;


    /*
     * ONE FINGER = MOVE
     */

    if(

      gesture.type === 'move' &&

      touches.length === 1

    ){


      pizzaX =

        gesture.pizzaX +

        (
          touches[0].clientX -
          gesture.startX
        );


      pizzaY =

        gesture.pizzaY +

        (
          touches[0].clientY -
          gesture.startY
        );


      updatePizza();


      return;

    }


    /*
     * TWO FINGERS
     *
     * MOVE
     * PINCH
     * ROTATE
     */

    if(touches.length >= 2){


      const center =
        getTouchCenter(touches);


      const distance =
        getTouchDistance(touches);


      const angle =
        getTouchAngle(touches);


      /*
       * MOVE
       */

      pizzaX =

        gesture.pizzaX +

        (
          center.x -
          gesture.centerX
        );


      pizzaY =

        gesture.pizzaY +

        (
          center.y -
          gesture.centerY
        );


      /*
       * SCALE
       */

      const scaleRatio =

        distance /
        gesture.distance;


      pizzaScale =

        gesture.pizzaScale *
        scaleRatio;


      /*
       * LIMIT SCALE
       */

      pizzaScale =

        Math.max(
          0.35,
          Math.min(
            2.5,
            pizzaScale
          )
        );


      /*
       * ROTATION
       */

      pizzaRotation =

        gesture.pizzaRotation +

        (
          angle -
          gesture.angle
        ) *

        180 /
        Math.PI;


      updatePizza();

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   TOUCH END
===================================================== */

gestureLayer.addEventListener(

  'touchend',

  event => {


    event.preventDefault();


    /*
     * ALL FINGERS RELEASED
     */

    if(event.touches.length === 0){

      gesture = null;

      return;

    }


    /*
     * TWO FINGERS -> ONE FINGER
     *
     * Start a fresh drag.
     * This prevents the pizza from jumping.
     */

    if(event.touches.length === 1){

      gesture = {

        type:'move',

        startX:
          event.touches[0].clientX,

        startY:
          event.touches[0].clientY,

        pizzaX:
          pizzaX,

        pizzaY:
          pizzaY

      };

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   TOUCH CANCEL
===================================================== */

gestureLayer.addEventListener(

  'touchcancel',

  () => {

    gesture = null;

  },

  {
    passive:false
  }

);


/* =====================================================
   DESKTOP MOUSE SUPPORT
===================================================== */

let mouseDown = false;

let mouseStartX = 0;

let mouseStartY = 0;

let mousePizzaX = 0;

let mousePizzaY = 0;


/* =====================================================
   MOUSE DOWN
===================================================== */

gestureLayer.addEventListener(

  'mousedown',

  event => {


    if(pizzaLocked){

      return;

    }


    event.preventDefault();


    mouseDown =
      true;


    mouseStartX =
      event.clientX;


    mouseStartY =
      event.clientY;


    mousePizzaX =
      pizzaX;


    mousePizzaY =
      pizzaY;


    gestureLayer.style.cursor =
      'grabbing';

  }

);


/* =====================================================
   MOUSE MOVE
===================================================== */

window.addEventListener(

  'mousemove',

  event => {


    if(!mouseDown){

      return;

    }


    if(pizzaLocked){

      return;

    }


    pizzaX =

      mousePizzaX +

      (
        event.clientX -
        mouseStartX
      );


    pizzaY =

      mousePizzaY +

      (
        event.clientY -
        mouseStartY
      );


    updatePizza();

  }

);


/* =====================================================
   MOUSE UP
===================================================== */

window.addEventListener(

  'mouseup',

  () => {


    mouseDown =
      false;


    gestureLayer.style.cursor =
      'grab';

  }

);


/* =====================================================
   PLACE / MOVE BUTTON
===================================================== */

placeBtn.addEventListener(

  'click',

  event => {


    /*
     * Prevent gesture layer
     * from seeing this click.
     */

    event.stopPropagation();


    pizzaLocked =
      !pizzaLocked;


    gesture =
      null;


    if(pizzaLocked){


      placeBtn.textContent =
        '↔ Move Pizza';


      camtip.textContent =
        '✓ Pizza fixed · Tap Move Pizza to reposition';


      gestureLayer.style.cursor =
        'default';

    }

    else{


      placeBtn.textContent =
        '✓ Place Pizza';


      camtip.textContent =
        'Drag • Pinch • Rotate, then tap Place Pizza';


      gestureLayer.style.cursor =
        'grab';

    }

  }

);


/* =====================================================
   CLOSE CAMERA
===================================================== */

document
.getElementById('camx')
.addEventListener(

  'click',

  event => {

    event.stopPropagation();

    closeCam();

  }

);


/* =====================================================
   CLOSE FUNCTION
===================================================== */

function closeCam(){


  /*
   * Stop camera tracks.
   */

  if(stream){

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  stream =
    null;


  camv.srcObject =
    null;


  /*
   * Hide camera.
   */

  cam.style.display =
    'none';


  fallbackModel.style.display =
    'none';


  placeBtn.style.display =
    'none';


  /*
   * Reset interaction.
   */

  gesture =
    null;


  mouseDown =
    false;


  pizzaLocked =
    false;

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(

  'pagehide',

  closeCam

);


/* =====================================================
   PREVENT PAGE SCROLL WHILE CAMERA IS OPEN
===================================================== */

document.addEventListener(

  'touchmove',

  event => {

    if(
      cam.style.display === 'block'
    ){

      if(
        event.target.closest(
          '#gestureLayer'
        )
      ){

        event.preventDefault();

      }

    }

  },

  {
    passive:false
  }

);

</script>


</body>

</html>
