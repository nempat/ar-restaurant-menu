<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurant Menu</title>

  <!-- Google Model Viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 18px;
      font-size: 24px;
      font-weight: bold;
    }

    .menu {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    }

    .food-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 18px;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    model-viewer {
      width: 100%;
      height: 330px;
      background: #eee;
      border-radius: 12px;
      overflow: hidden;
    }

    .ar-button {
      position: absolute;
      bottom: 16px;
      right: 16px;

      border: none;
      border-radius: 25px;

      padding: 14px 22px;

      background: #111;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .ar-button:active {
      transform: scale(0.97);
    }

    .status {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 8px;
    }

    #arMessage {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #fff3cd;
      color: #664d03;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    🍕 Our Menu
  </header>

  <main class="menu">

    <div class="card">

      <img
        class="food-image"
        src="pizza.jpg"
        alt="Margherita Pizza"
      >

      <div class="content">

        <div class="name">
          Margherita Pizza
        </div>

        <div class="price">
          ₹349
        </div>

        <!-- WEBXR ONLY -->
        <model-viewer
          id="pizzaModel"

          src="pizza.glb"

          alt="3D Margherita Pizza"

          ar

          ar-modes="webxr"

          ar-placement="floor"

          ar-scale="fixed"

          camera-controls

          touch-action="pan-y"

          shadow-intensity="1"

          exposure="1"

          loading="eager"
        >

          <button
            slot="ar-button"
            class="ar-button"
          >
            📱 View in AR
          </button>

        </model-viewer>

        <div class="status">
          WebXR AR — place the pizza on your table
        </div>

        <div id="arMessage"></div>

      </div>
    </div>

  </main>

  <script>
    const model = document.getElementById("pizzaModel");
    const message = document.getElementById("arMessage");

    /*
      WebXR status
    */

    model.addEventListener("ar-status", (event) => {

      const status = event.detail.status;

      if (status === "session-started") {
        message.style.display = "block";
        message.textContent =
          "Move your phone slowly until the table is detected.";
      }

      if (status === "object-placed") {
        message.style.display = "block";
        message.textContent =
          "🍕 Pizza placed. Move your phone around it.";
      }

      if (status === "failed") {
        message.style.display = "block";
        message.textContent =
          "WebXR AR could not start on this device/browser.";
      }

      if (status === "not-presenting") {
        message.style.display = "none";
      }
    });

    /*
      WebXR tracking status
    */

    model.addEventListener("ar-tracking", (event) => {

      if (event.detail.status === "not-tracking") {

        message.style.display = "block";

        message.textContent =
          "Move the phone slowly and point it at the table.";
      }

      if (event.detail.status === "tracking") {

        message.style.display = "block";

        message.textContent =
          "Surface detected. Place the pizza.";
      }
    });
  </script>

</body>
</html>
