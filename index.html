
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Menu v5</title>

<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>

<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:system-ui,sans-serif;
    background:#fff8f0;
    color:#2b1d14
  }

  header{
    padding:26px 16px 6px;
    text-align:center
  }

  h1{
    margin:0;
    font-size:1.6rem
  }

  header p{
    margin:6px 0 0;
    color:#8a7566;
    font-size:.92rem
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:16px;
    display:grid;
    gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr))
  }

  .card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 16px #0002
  }

  .card model-viewer{
    width:100%;
    height:270px;
    background:#fff3e6
  }

  .info{
    padding:14px 16px 16px
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline
  }

  .row h2{
    margin:0;
    font-size:1.1rem
  }

  .price{
    font-weight:700;
    color:#d9381e
  }

  .info p{
    margin:6px 0 10px;
    color:#8a7566;
    font-size:.9rem
  }

  .btn{
    background:#d9381e;
    color:#fff;
    border:0;
    border-radius:999px;
    padding:11px 18px;
    font-size:.95rem;
    font-weight:600;
    width:100%;
    cursor:pointer
  }

  .ar-btn{
    position:absolute;
    bottom:12px;
    right:12px;
    background:#2b1d14;
    color:#fff;
    border:0;
    border-radius:999px;
    padding:10px 16px;
    font-size:.9rem;
    font-weight:600
  }

  .note{
    margin:8px 16px 0;
    font-size:.8rem;
    color:#b00020;
    display:none
  }

  /* ================= CAMERA FALLBACK ================= */

  #cam{
    position:fixed;
    inset:0;
    z-index:99;
    background:#000;
    display:none;
    overflow:hidden
  }

  #cam video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover
  }

  #fallback-model{
    position:absolute;
    width:280px;
    height:280px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:transparent;
    --poster-color:transparent;
    --progress-bar-color:transparent;
  }

  #camx{
    position:absolute;
    top:14px;
    right:14px;
    z-index:5;
    background:#fff;
    border:0;
    border-radius:999px;
    padding:10px 16px;
    font-weight:700;
    cursor:pointer
  }

  #camtip{
    position:absolute;
    bottom:22px;
    left:0;
    right:0;
    text-align:center;
    color:#fff;
    font-size:.9rem;
    text-shadow:0 1px 4px #000;
    z-index:5
  }

  #placeBtn{
    position:absolute;
    bottom:65px;
    left:50%;
    transform:translateX(-50%);
    z-index:6;
    background:#d9381e;
    color:#fff;
    border:0;
    border-radius:999px;
    padding:12px 22px;
    font-size:.95rem;
    font-weight:700;
    display:none
  }

  /* Hide fallback model until camera starts */
  #fallback-model{
    display:none
  }
</style>
</head>

<body>

<header>
  <h1>🍕 Our Menu (v3)</h1>
  <p>See the dish on your table through your camera. No app needed.</p>
</header>

<main id="menu"></main>

<!-- CAMERA FALLBACK -->

<div id="cam">

  <video
    id="camv"
    autoplay
    playsinline
    muted>
  </video>

  <model-viewer
    id="fallback-model"
    camera-controls
    interaction-prompt="none"
    shadow-intensity="1"
    touch-action="none">
  </model-viewer>

  <button id="placeBtn">
    ✓ Place Pizza
  </button>

  <button id="camx">
    ✕ Close
  </button>

  <div id="camtip">
    Move the pizza to where you want it, then tap Place Pizza
  </div>

</div>

<script>

/* MENU */

const ITEMS = [
  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },
  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }
];

const PATHS = [
  'pizza.glb',
  'assets/pizza.glb',
  'models/pizza.glb'
];


/* CREATE MENU */

document.getElementById('menu').innerHTML =
ITEMS.map((item,index) => `

  <article class="card">

    <model-viewer
      id="model-${index}"
      src="${PATHS[0]}"
      alt="${item.name}"
      ar
      ar-modes="webxr"
      ar-placement="floor"
      ar-scale="fixed"
      camera-controls
      camera-orbit="0deg 75deg 100%"
      field-of-view="45deg"
      auto-rotate
      shadow-intensity="1"
      touch-action="pan-y"
      interaction-prompt="auto"
      loading="lazy">

      <button slot="ar-button" class="ar-btn">
        📱 Place on surface
      </button>

    </model-viewer>

    <div class="note"></div>

    <div class="info">

      <div class="row">
        <h2>${item.name}</h2>
        <span class="price">${item.price}</span>
      </div>

      <p>${item.desc}</p>

      <button
        class="btn camopen"
        data-index="${index}">
        📷 View with camera
      </button>

    </div>

  </article>

`).join('');


/* MODEL FALLBACK */

document
.querySelectorAll('.card')
.forEach((card,index) => {

  const mv = card.querySelector('model-viewer');
  let pathIndex = 0;

  mv.addEventListener('error', () => {

    pathIndex++;

    if(pathIndex < PATHS.length){
      mv.src = PATHS[pathIndex];
    }
    else{
      const note = card.querySelector('.note');
      note.style.display = 'block';
      note.textContent = 'pizza.glb not found in your repo.';
    }

  });

  /* CAMERA BUTTON */

  card
  .querySelector('.camopen')
  .addEventListener('click', () => {
    openAR(mv.src);
  });

});


/* CAMERA ELEMENTS */

const cam = document.getElementById('cam');
const camv = document.getElementById('camv');
const fallbackModel = document.getElementById('fallback-model');
const placeBtn = document.getElementById('placeBtn');

let stream = null;


/* OPEN AR */

async function openAR(src){

  const webxrSupported = await checkWebXR();

  if(webxrSupported){

    const models = document.querySelectorAll('model-viewer');

    for(const model of models){

      if(model.src === src){

        try{
          await model.activateAR();
          return;
        }
        catch(error){
          console.log('WebXR failed:', error);
        }

      }

    }

  }

  openCameraFallback(src);
}


/* CHECK WEBXR */

async function checkWebXR(){

  if(!navigator.xr){
    return false;
  }

  try{
    return await navigator.xr.isSessionSupported('immersive-ar');
  }
  catch(error){
    console.log('WebXR detection failed:', error);
    return false;
  }

}


/* CAMERA FALLBACK */

async function openCameraFallback(src){

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{
          ideal:'environment'
        }
      },
      audio:false
    });

    camv.srcObject = stream;
    await camv.play();

    fallbackModel.src = src;
    fallbackModel.style.display = 'block';

    placeBtn.style.display = 'block';
    cam.style.display = 'block';

  }
  catch(error){

    console.error(error);

    alert(
      'Camera could not start. ' +
      'Please allow camera permission ' +
      'and make sure this website uses HTTPS.'
    );

  }

}


/* PLACE BUTTON */

placeBtn.addEventListener('click', () => {

  placeBtn.style.display = 'none';

  document.getElementById('camtip').textContent =
    'Pizza placed · Move it again by dragging';

});


/* CLOSE */

document
.getElementById('camx')
.addEventListener('click', closeCam);


function closeCam(){

  if(stream){
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;
  camv.srcObject = null;
  fallbackModel.style.display = 'none';
  placeBtn.style.display = 'none';
  cam.style.display = 'none';

}


/* CLEANUP WHEN PAGE CLOSES */

window.addEventListener('pagehide', closeCam);

</script>

</body>
</html>
