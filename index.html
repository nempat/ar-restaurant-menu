<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>AR Menu v6</title>

<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:system-ui,sans-serif;
    background:#fff8f0;
    color:#2b1d14
  }

  header{
    padding:26px 16px 6px;
    text-align:center
  }

  h1{
    margin:0;
    font-size:1.6rem
  }

  header p{
    margin:6px 0 0;
    color:#8a7566;
    font-size:.92rem
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:16px;
    display:grid;
    gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr))
  }

  .card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 16px #0002
  }

  .card model-viewer{
    width:100%;
    height:270px;
    background:#fff3e6
  }

  .info{
    padding:14px 16px 16px
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline
  }

  .row h2{
    margin:0;
    font-size:1.1rem
  }

  .price{
    font-weight:700;
    color:#d9381e
  }

  .info p{
    margin:6px 0 10px;
    color:#8a7566;
    font-size:.9rem
  }

  .btn{
    background:#d9381e;
    color:#fff;
    border:0;
    border-radius:999px;
    padding:11px 18px;
    font-size:.95rem;
    font-weight:600;
    width:100%;
    cursor:pointer
  }

  .ar-btn{
    position:absolute;
    bottom:12px;
    right:12px;
    background:#2b1d14;
    color:#fff;
    border:0;
    border-radius:999px;
    padding:10px 16px;
    font-size:.9rem;
    font-weight:600
  }

  .note{
    margin:8px 16px 0;
    font-size:.8rem;
    color:#b00020;
    display:none
  }

  /* =========================================
     REAL WEBXR AR
  ========================================= */

  #ar{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    background:#000;
    overflow:hidden;
  }

  #ar canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  #ar-close{
    position:absolute;
    top:calc(14px + env(safe-area-inset-top));
    right:14px;
    z-index:10;

    background:#fff;
    color:#2b1d14;

    border:0;
    border-radius:999px;

    padding:10px 16px;

    font-weight:700;
    font-size:.95rem;

    cursor:pointer;
  }

  #ar-place{
    position:absolute;
    left:50%;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translateX(-50%);

    z-index:10;

    background:#d9381e;
    color:#fff;

    border:0;
    border-radius:999px;

    padding:13px 24px;

    font-size:.95rem;
    font-weight:700;

    display:none;
  }

  #ar-tip{
    position:absolute;

    left:20px;
    right:20px;

    bottom:calc(82px + env(safe-area-inset-bottom));

    z-index:10;

    text-align:center;

    color:#fff;

    font-size:.9rem;

    text-shadow:
      0 1px 5px #000,
      0 1px 10px #000;

    pointer-events:none;
  }

  #ar-reticle{
    position:absolute;

    left:50%;
    top:50%;

    width:70px;
    height:70px;

    margin-left:-35px;
    margin-top:-35px;

    border:2px solid rgba(255,255,255,.9);

    border-radius:50%;

    display:none;

    z-index:5;

    pointer-events:none;
  }

  #ar-reticle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:6px;
    height:6px;

    margin:-3px;

    background:#fff;

    border-radius:50%;
  }

  #ar-message{
    position:absolute;

    left:20px;
    right:20px;

    top:50%;

    transform:translateY(-50%);

    z-index:20;

    background:#fff;

    color:#2b1d14;

    padding:20px;

    border-radius:18px;

    text-align:center;

    box-shadow:0 8px 30px #0005;

    display:none;
  }

  #ar-message h3{
    margin:0 0 8px;
  }

  #ar-message p{
    margin:0;

    color:#8a7566;

    font-size:.9rem;
  }
</style>
</head>

<body>

<header>
  <h1>🍕 Our Menu (v3)</h1>
  <p>See the dish on your table through your camera. No app needed.</p>
</header>

<main id="menu"></main>


<!-- =========================================
     REAL WEBXR AR SCREEN
========================================= -->

<div id="ar">

  <button id="ar-close">
    ✕ Close
  </button>

  <div id="ar-reticle"></div>

  <button id="ar-place">
    ✓ Place Pizza
  </button>

  <div id="ar-tip">
    Move your phone slowly to detect the table
  </div>

  <div id="ar-message">
    <h3 id="ar-message-title">
      AR unavailable
    </h3>

    <p id="ar-message-text">
      This device or browser does not support
      browser-based world-tracked AR.
    </p>
  </div>

</div>


<!-- =========================================
     THREE.JS
========================================= -->

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from
  'three';

import { GLTFLoader } from
  'three/addons/loaders/GLTFLoader.js';


/* =====================================================
   MENU
===================================================== */

const ITEMS = [

  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },

  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }

];


const PATHS = [
  'pizza.glb',
  'assets/pizza.glb',
  'models/pizza.glb'
];


/* =====================================================
   MENU UI
===================================================== */

document.getElementById('menu').innerHTML =
ITEMS.map((item,index) => `

  <article class="card">

    <model-viewer
      src="${PATHS[0]}"
      alt="${item.name}"

      camera-controls
      auto-rotate
      shadow-intensity="1"
      touch-action="pan-y"
      loading="lazy"

      style="
        width:100%;
        height:270px;
        background:#fff3e6;
      "
    >
    </model-viewer>


    <div class="note"></div>


    <div class="info">

      <div class="row">

        <h2>
          ${item.name}
        </h2>

        <span class="price">
          ${item.price}
        </span>

      </div>

      <p>
        ${item.desc}
      </p>

      <button
        class="btn camopen"
        data-index="${index}">

        📷 View with camera

      </button>

    </div>

  </article>

`).join('');


/* =====================================================
   NORMAL MODEL PATH FALLBACK
===================================================== */

document
.querySelectorAll('.card')
.forEach((card,index) => {

  const mv =
    card.querySelector('model-viewer');

  let pathIndex = 0;

  mv.addEventListener(
    'error',
    () => {

      pathIndex++;

      if(pathIndex < PATHS.length){

        mv.src =
          PATHS[pathIndex];

      }
      else{

        const note =
          card.querySelector('.note');

        note.style.display =
          'block';

        note.textContent =
          'pizza.glb not found in your repo.';

      }

    }
  );


  card
    .querySelector('.camopen')
    .addEventListener(
      'click',
      () => {

        startAR(PATHS[0]);

      }
    );

});


/* =====================================================
   AR VARIABLES
===================================================== */

const ar =
  document.getElementById('ar');

const canvas =
  document.createElement('canvas');

const arTip =
  document.getElementById('ar-tip');

const arPlace =
  document.getElementById('ar-place');

const arClose =
  document.getElementById('ar-close');

const arReticle =
  document.getElementById('ar-reticle');

const arMessage =
  document.getElementById('ar-message');

const arMessageTitle =
  document.getElementById('ar-message-title');

const arMessageText =
  document.getElementById('ar-message-text');


let renderer;

let scene;

let camera;

let controller;

let reticle;

let pizza = null;

let xrSession = null;

let hitTestSource = null;

let hitTestSourceRequested = false;

let placed = false;


/* =====================================================
   THREE.JS SETUP
===================================================== */

function setupThree(){

  scene =
    new THREE.Scene();


  camera =
    new THREE.PerspectiveCamera();


  renderer =
    new THREE.WebGLRenderer({

      canvas:canvas,

      alpha:true,

      antialias:true

    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio || 1,
      2
    )
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  renderer.xr.enabled =
    true;


  renderer.outputColorSpace =
    THREE.SRGBColorSpace;


  renderer.shadowMap.enabled =
    true;


  /* -----------------------------------------
     LIGHTING
  ----------------------------------------- */

  const ambient =
    new THREE.HemisphereLight(
      0xffffff,
      0x888888,
      2
    );

  scene.add(ambient);


  const directional =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  directional.position.set(
    2,
    4,
    2
  );

  directional.castShadow =
    true;

  scene.add(directional);


  /* -----------------------------------------
     RETICLE
  ----------------------------------------- */

  const ringGeometry =
    new THREE.RingGeometry(
      0.08,
      0.10,
      32
    );


  ringGeometry.rotateX(
    -Math.PI / 2
  );


  const ringMaterial =
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });


  reticle =
    new THREE.Mesh(
      ringGeometry,
      ringMaterial
    );


  reticle.matrixAutoUpdate =
    false;


  reticle.visible =
    false;


  scene.add(reticle);


  /* -----------------------------------------
     XR CONTROLLER
  ----------------------------------------- */

  controller =
    renderer.xr.getController(0);


  controller.addEventListener(
    'select',
    onSelect
  );


  scene.add(controller);


  ar.appendChild(canvas);

}


/* =====================================================
   LOAD PIZZA
===================================================== */

async function loadPizza(src){

  if(pizza){

    scene.remove(
      pizza
    );

    pizza = null;

  }


  const loader =
    new GLTFLoader();


  return new Promise(
    (resolve,reject) => {

      loader.load(

        src,

        gltf => {

          pizza =
            gltf.scene;


          /*
           * IMPORTANT
           *
           * We don't put the pizza
           * relative to the camera.
           *
           * Its position will later
           * come from the WebXR hit-test
           * world coordinates.
           */

          pizza.visible =
            false;


          pizza.traverse(
            object => {

              if(
                object.isMesh
              ){

                object.castShadow =
                  true;

                object.receiveShadow =
                  true;

              }

            }
          );


          scene.add(
            pizza
          );


          resolve(
            pizza
          );

        },

        undefined,

        error => {

          reject(error);

        }

      );

    }
  );

}


/* =====================================================
   CHECK WEBXR
===================================================== */

async function supportsAR(){

  if(!navigator.xr){

    return false;

  }


  try{

    return await
      navigator.xr.isSessionSupported(
        'immersive-ar'
      );

  }
  catch(error){

    console.error(error);

    return false;

  }

}


/* =====================================================
   START AR
===================================================== */

async function startAR(src){

  const supported =
    await supportsAR();


  if(!supported){

    showUnsupported();

    return;

  }


  try{

    setupThree();


    await loadPizza(src);


    xrSession =
      await navigator.xr.requestSession(
        'immersive-ar',
        {

          requiredFeatures:[
            'hit-test',
            'local-floor'
          ],

          optionalFeatures:[
            'dom-overlay',
            'anchors',
            'plane-detection'
          ]

        }
      );


    xrSession.addEventListener(
      'end',
      onSessionEnd
    );


    renderer.xr.setReferenceSpaceType(
      'local-floor'
    );


    await renderer.xr.setSession(
      xrSession
    );


    ar.style.display =
      'block';


    arReticle.style.display =
      'block';


    arTip.textContent =
      'Move your phone slowly to find a surface';


    placed =
      false;


    arPlace.style.display =
      'none';


    hitTestSourceRequested =
      false;


    hitTestSource =
      null;


    renderer.setAnimationLoop(
      renderAR
    );

  }
  catch(error){

    console.error(
      'Could not start WebXR:',
      error
    );


    if(
      xrSession
    ){

      try{
        await xrSession.end();
      }
      catch(e){}
    }


    showUnsupported();

  }

}


/* =====================================================
   HIT TEST
===================================================== */

async function requestHitTestSource(
  frame
){

  if(
    hitTestSourceRequested
  ){

    return;

  }


  const session =
    renderer.xr.getSession();


  const viewerSpace =
    await session.requestReferenceSpace(
      'viewer'
    );


  hitTestSource =
    await session.requestHitTestSource({
      space:viewerSpace
    });


  hitTestSourceRequested =
    true;


  session.addEventListener(
    'end',
    () => {

      hitTestSourceRequested =
        false;

      hitTestSource =
        null;

    }
  );

}


/* =====================================================
   RENDER LOOP
===================================================== */

function renderAR(
  timestamp,
  frame
){

  if(!frame){

    return;

  }


  const session =
    renderer.xr.getSession();


  requestHitTestSource(
    frame
  );


  if(
    hitTestSource
  ){

    const referenceSpace =
      renderer.xr.getReferenceSpace();


    const hitResults =
      frame.getHitTestResults(
        hitTestSource
      );


    if(
      hitResults.length > 0
    ){

      const hit =
        hitResults[0];


      const pose =
        hit.getPose(
          referenceSpace
        );


      if(pose){

        /*
         * Reticle follows the REAL
         * detected surface.
         */

        reticle.visible =
          !placed;


        reticle.matrix.fromArray(
          pose.transform.matrix
        );


        /*
         * If the pizza has NOT been
         * placed yet, preview it at
         * the detected real-world
         * position.
         */

        if(
          pizza &&
          !placed
        ){

          pizza.matrixAutoUpdate =
            false;

          pizza.matrix.fromArray(
            pose.transform.matrix
          );

          pizza.visible =
            true;

        }


        if(
          !placed
        ){

          arTip.textContent =
            'Tap the screen to place the pizza';

          arPlace.style.display =
            'block';

        }

      }

    }
    else{

      reticle.visible =
        false;


      if(
        !placed
      ){

        arTip.textContent =
          'Move your phone slowly to find a surface';

        arPlace.style.display =
          'none';

      }

    }

  }


  renderer.render(
    scene,
    camera
  );

}


/* =====================================================
   USER TAPS SCREEN
===================================================== */

function onSelect(){

  if(
    !pizza ||
    !reticle.visible
  ){

    return;

  }


  /*
   * CRITICAL PART
   *
   * Copy the current WORLD-SPACE
   * reticle transform.
   *
   * After this point the pizza is
   * NOT attached to the camera.
   */

  pizza.matrix.copy(
    reticle.matrix
  );


  pizza.matrixAutoUpdate =
    false;


  pizza.visible =
    true;


  placed =
    true;


  reticle.visible =
    false;


  arPlace.style.display =
    'none';


  arTip.textContent =
    '🍕 Pizza placed — move around it';


  /*
   * The pizza's matrix is now
   * independent of the camera.
   *
   * WebXR's tracking system keeps
   * the world coordinate system
   * stable while the user moves.
   */

}


/* =====================================================
   MANUAL PLACE BUTTON
===================================================== */

arPlace.addEventListener(
  'click',
  () => {

    if(
      !pizza ||
      !reticle.visible
    ){

      return;

    }


    pizza.matrix.copy(
      reticle.matrix
    );


    pizza.matrixAutoUpdate =
      false;


    pizza.visible =
      true;


    placed =
      true;


    reticle.visible =
      false;


    arPlace.style.display =
      'none';


    arTip.textContent =
      '🍕 Pizza placed — move around it';

  }
);


/* =====================================================
   CLOSE AR
===================================================== */

arClose.addEventListener(
  'click',
  async () => {

    if(
      xrSession
    ){

      try{

        await xrSession.end();

      }
      catch(error){

        console.log(error);

      }

    }

  }
);


/* =====================================================
   SESSION END
===================================================== */

function onSessionEnd(){

  renderer.setAnimationLoop(
    null
  );


  if(
    pizza
  ){

    scene.remove(
      pizza
    );

    pizza = null;

  }


  hitTestSource =
    null;

  hitTestSourceRequested =
    false;

  xrSession =
    null;

  ar.style.display =
    'none';

  arReticle.style.display =
    'none';

  arPlace.style.display =
    'none';

}


/* =====================================================
   UNSUPPORTED DEVICE
===================================================== */

function showUnsupported(){

  ar.style.display =
    'block';


  arMessage.style.display =
    'block';


  arMessageTitle.textContent =
    'AR is not supported here';


  arMessageText.textContent =
    'This browser does not provide world-tracked AR. Please try a browser/device with WebXR AR support. No app installation is required.';


  arTip.textContent =
    '';


  arReticle.style.display =
    'none';


  arPlace.style.display =
    'none';

}


/* =====================================================
   CLOSE UNSUPPORTED SCREEN
===================================================== */

arClose.addEventListener(
  'click',
  () => {

    if(
      !xrSession
    ){

      ar.style.display =
        'none';

      arMessage.style.display =
        'none';

    }

  }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  'resize',
  () => {

    if(
      !renderer ||
      !camera
    ){

      return;

    }


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>


<!-- model-viewer is only used for the normal menu preview -->
<script type="module"
src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>

</body>
</html>
