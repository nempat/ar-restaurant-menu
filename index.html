<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Menu v5</title>

<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#fff8f0;
  color:#2b1d14
}

header{
  padding:26px 16px 6px;
  text-align:center
}

h1{
  margin:0;
  font-size:1.6rem
}

header p{
  margin:6px 0 0;
  color:#8a7566;
  font-size:.92rem
}

main{
  max-width:900px;
  margin:0 auto;
  padding:16px;
  display:grid;
  gap:18px;
  grid-template-columns:repeat(
    auto-fill,
    minmax(280px,1fr)
  )
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px #0002
}

.card model-viewer{
  width:100%;
  height:270px;
  background:#fff3e6
}

.info{
  padding:14px 16px 16px
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline
}

.row h2{
  margin:0;
  font-size:1.1rem
}

.price{
  font-weight:700;
  color:#d9381e
}

.info p{
  margin:6px 0 10px;
  color:#8a7566;
  font-size:.9rem
}

.btn{
  background:#d9381e;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-size:.95rem;
  font-weight:600;
  width:100%;
  cursor:pointer
}

.ar-btn{
  position:absolute;
  bottom:12px;
  right:12px;
  background:#2b1d14;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 16px;
  font-size:.9rem;
  font-weight:600
}

.note{
  margin:8px 16px 0;
  font-size:.8rem;
  color:#b00020;
  display:none
}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

#cam{
  position:fixed;
  inset:0;
  z-index:99;
  background:#000;
  display:none;
  overflow:hidden;
  touch-action:none;
}

#cam video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}


/* =====================================================
   FALLBACK MODEL
===================================================== */

#fallback-model{

  position:absolute;

  width:280px;
  height:280px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(0deg);

  background:transparent;

  --poster-color:transparent;
  --progress-bar-color:transparent;

  display:none;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;

  cursor:grab;
}

#fallback-model.dragging{
  cursor:grabbing;
}


/* =====================================================
   CLOSE
===================================================== */

#camx{
  position:absolute;
  top:14px;
  right:14px;
  z-index:10;

  background:#fff;
  border:0;
  border-radius:999px;

  padding:10px 16px;

  font-weight:700;
  cursor:pointer
}


/* =====================================================
   TIP
===================================================== */

#camtip{
  position:absolute;

  bottom:22px;
  left:0;
  right:0;

  text-align:center;

  color:#fff;

  font-size:.9rem;

  text-shadow:0 1px 4px #000;

  z-index:5;

  pointer-events:none
}


/* =====================================================
   PLACE / MOVE
===================================================== */

#placeBtn{

  position:absolute;

  bottom:65px;
  left:50%;

  transform:translateX(-50%);

  z-index:10;

  background:#d9381e;

  color:#fff;

  border:0;

  border-radius:999px;

  padding:12px 22px;

  font-size:.95rem;

  font-weight:700;

  display:none;

  cursor:pointer
}

</style>
</head>


<body>


<header>

  <h1>
    🍕 Our Menu (v3)
  </h1>

  <p>
    See the dish on your table through your camera. No app needed.
  </p>

</header>


<main id="menu"></main>


<!-- ==================================================
     CAMERA FALLBACK
================================================== -->

<div id="cam">

  <video
    id="camv"
    autoplay
    playsinline
    muted>
  </video>


  <model-viewer
    id="fallback-model"
    interaction-prompt="none"
    shadow-intensity="1"
    touch-action="none">
  </model-viewer>


  <button id="placeBtn">
    ✓ Place Pizza
  </button>


  <button id="camx">
    ✕ Close
  </button>


  <div id="camtip">

    Move the pizza to where you want it,
    then tap Place Pizza

  </div>

</div>


<script>

/* =====================================================
   MENU
===================================================== */

const ITEMS = [

  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },

  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }

];


const PATHS = [

  'pizza.glb',
  'assets/pizza.glb',
  'models/pizza.glb'

];


/* =====================================================
   CREATE MENU
===================================================== */

document.getElementById('menu').innerHTML =

ITEMS.map((item,index) => `

  <article class="card">

    <model-viewer

      id="model-${index}"

      src="${PATHS[0]}"

      alt="${item.name}"

      ar

      ar-modes="webxr"

      ar-placement="floor"

      ar-scale="fixed"

      camera-controls

      auto-rotate

      shadow-intensity="1"

      touch-action="pan-y"

      interaction-prompt="auto"

      loading="lazy"

    >

      <button
        slot="ar-button"
        class="ar-btn">

        📱 Place on surface

      </button>

    </model-viewer>


    <div class="note"></div>


    <div class="info">

      <div class="row">

        <h2>
          ${item.name}
        </h2>

        <span class="price">
          ${item.price}
        </span>

      </div>


      <p>
        ${item.desc}
      </p>


      <button
        class="btn camopen"
        data-index="${index}">

        📷 View with camera

      </button>

    </div>

  </article>

`).join('');


/* =====================================================
   MODEL FALLBACK
===================================================== */

document
.querySelectorAll('.card')
.forEach((card,index) => {

  const mv =
    card.querySelector('model-viewer');

  let pathIndex = 0;


  mv.addEventListener(
    'error',
    () => {

      pathIndex++;


      if(pathIndex < PATHS.length){

        mv.src =
          PATHS[pathIndex];

      }

      else{

        const note =
          card.querySelector('.note');

        note.style.display =
          'block';

        note.textContent =
          'pizza.glb not found in your repo.';

      }

    }
  );


  card
  .querySelector('.camopen')
  .addEventListener(
    'click',
    () => {

      openAR(mv.src);

    }
  );

});


/* =====================================================
   CAMERA ELEMENTS
===================================================== */

const cam =
  document.getElementById('cam');

const camv =
  document.getElementById('camv');

const fallbackModel =
  document.getElementById(
    'fallback-model'
  );

const placeBtn =
  document.getElementById(
    'placeBtn'
  );

let stream = null;


/* =====================================================
   PIZZA STATE
===================================================== */

let pizzaLocked = false;

let dragging = false;


/*
 * Current pizza transform
 */

let pizzaX = 0;
let pizzaY = 0;

let pizzaScale = 1;

let pizzaRotation = 0;


/* =====================================================
   OPEN AR
===================================================== */

async function openAR(src){

  const webxrSupported =
    await checkWebXR();


  if(webxrSupported){

    const models =
      document.querySelectorAll(
        'model-viewer'
      );


    for(const model of models){

      if(model.src === src){

        try{

          await model.activateAR();

          return;

        }
        catch(error){

          console.log(
            'WebXR failed:',
            error
          );

        }

      }

    }

  }


  openCameraFallback(src);

}


/* =====================================================
   WEBXR CHECK
===================================================== */

async function checkWebXR(){

  if(!navigator.xr){

    return false;

  }


  try{

    return await navigator.xr.isSessionSupported(
      'immersive-ar'
    );

  }
  catch(error){

    console.log(
      'WebXR detection failed:',
      error
    );

    return false;

  }

}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

async function openCameraFallback(src){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:'environment'
          }
        },

        audio:false

      });


    camv.srcObject =
      stream;


    fallbackModel.src =
      src;


    /*
     * Reset transform
     */

    pizzaX =
      window.innerWidth / 2;

    pizzaY =
      window.innerHeight / 2;

    pizzaScale =
      1;

    pizzaRotation =
      0;


    pizzaLocked =
      false;


    dragging =
      false;


    /*
     * Apply transform
     */

    updatePizza();


    /*
     * Reset button
     */

    placeBtn.textContent =
      '✓ Place Pizza';


    fallbackModel.style.display =
      'block';

    placeBtn.style.display =
      'block';

    cam.style.display =
      'block';


    document.getElementById(
      'camtip'
    ).textContent =
      'Drag • Pinch • Rotate, then tap Place Pizza';

  }

  catch(error){

    console.error(error);


    alert(
      'Camera could not start. ' +
      'Please allow camera permission ' +
      'and make sure this website uses HTTPS.'
    );

  }

}


/* =====================================================
   APPLY PIZZA TRANSFORM
===================================================== */

function updatePizza(){

  fallbackModel.style.left =
    pizzaX + 'px';

  fallbackModel.style.top =
    pizzaY + 'px';

  fallbackModel.style.transform =
    `
      translate(-50%,-50%)
      rotate(${pizzaRotation}deg)
      scale(${pizzaScale})
    `;

}


/* =====================================================
   POINTER TRACKING
===================================================== */

/*
 * We use Pointer Events so:
 *
 * 1 finger  = move
 * 2 fingers = pinch + rotate
 */

const pointers =
  new Map();


let gestureStart = null;


/* =====================================================
   DISTANCE BETWEEN TWO FINGERS
===================================================== */

function distance(a,b){

  const dx =
    b.x - a.x;

  const dy =
    b.y - a.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =====================================================
   ANGLE BETWEEN TWO FINGERS
===================================================== */

function angle(a,b){

  return Math.atan2(
    b.y - a.y,
    b.x - a.x
  ) * 180 / Math.PI;

}


/* =====================================================
   GET CENTER OF FINGERS
===================================================== */

function center(a,b){

  return {

    x:
      (a.x + b.x) / 2,

    y:
      (a.y + b.y) / 2

  };

}


/* =====================================================
   POINTER DOWN
===================================================== */

fallbackModel.addEventListener(

  'pointerdown',

  event => {

    /*
     * Locked = no editing
     */

    if(pizzaLocked){

      return;

    }


    event.preventDefault();


    pointers.set(
      event.pointerId,
      {
        x:event.clientX,
        y:event.clientY
      }
    );


    fallbackModel.classList.add(
      'dragging'
    );


    /*
     * Capture pointer
     */

    try{

      fallbackModel.setPointerCapture(
        event.pointerId
      );

    }
    catch(error){}


    /*
     * FIRST FINGER
     *
     * Start moving.
     */

    if(pointers.size === 1){

      const p =
        [...pointers.values()][0];


      gestureStart = {

        type:'move',

        pointerX:p.x,
        pointerY:p.y,

        pizzaX:pizzaX,
        pizzaY:pizzaY

      };

    }


    /*
     * SECOND FINGER
     *
     * Start pinch + rotation.
     */

    if(pointers.size === 2){

      const pts =
        [...pointers.values()];


      const a =
        pts[0];

      const b =
        pts[1];


      const c =
        center(a,b);


      gestureStart = {

        type:'transform',

        centerX:c.x,
        centerY:c.y,

        distance:
          distance(a,b),

        angle:
          angle(a,b),

        pizzaX:pizzaX,
        pizzaY:pizzaY,

        pizzaScale:pizzaScale,

        pizzaRotation:pizzaRotation

      };

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   POINTER MOVE
===================================================== */

fallbackModel.addEventListener(

  'pointermove',

  event => {

    if(pizzaLocked){

      return;

    }


    if(!pointers.has(
      event.pointerId
    )){

      return;

    }


    event.preventDefault();


    /*
     * Update pointer.
     */

    pointers.set(
      event.pointerId,
      {
        x:event.clientX,
        y:event.clientY
      }
    );


    /*
     * ONE FINGER
     *
     * MOVE
     */

    if(
      pointers.size === 1 &&
      gestureStart &&
      gestureStart.type === 'move'
    ){

      const p =
        [...pointers.values()][0];


      const dx =
        p.x -
        gestureStart.pointerX;


      const dy =
        p.y -
        gestureStart.pointerY;


      pizzaX =
        gestureStart.pizzaX +
        dx;


      pizzaY =
        gestureStart.pizzaY +
        dy;


      keepPizzaInsideScreen();


      updatePizza();

      return;

    }


    /*
     * TWO FINGERS
     *
     * PINCH + ROTATE + MOVE
     */

    if(
      pointers.size === 2 &&
      gestureStart &&
      gestureStart.type === 'transform'
    ){

      const pts =
        [...pointers.values()];


      const a =
        pts[0];

      const b =
        pts[1];


      const c =
        center(a,b);


      /*
       * MOVE
       *
       * Move using the center
       * of the two fingers.
       */

      pizzaX =
        gestureStart.pizzaX +
        (
          c.x -
          gestureStart.centerX
        );


      pizzaY =
        gestureStart.pizzaY +
        (
          c.y -
          gestureStart.centerY
        );


      /*
       * PINCH
       */

      const newDistance =
        distance(a,b);


      if(
        gestureStart.distance > 0
      ){

        pizzaScale =
          gestureStart.pizzaScale *
          (
            newDistance /
            gestureStart.distance
          );

      }


      /*
       * Limit size.
       */

      pizzaScale =
        Math.max(
          0.35,
          Math.min(
            2.5,
            pizzaScale
          )
        );


      /*
       * ROTATE
       */

      const newAngle =
        angle(a,b);


      pizzaRotation =
        gestureStart.pizzaRotation +
        (
          newAngle -
          gestureStart.angle
        );


      keepPizzaInsideScreen();


      updatePizza();

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   POINTER UP
===================================================== */

function pointerEnd(event){

  pointers.delete(
    event.pointerId
  );


  /*
   * No fingers left.
   */

  if(pointers.size === 0){

    gestureStart = null;

    dragging = false;

    fallbackModel.classList.remove(
      'dragging'
    );

    return;

  }


  /*
   * One finger remains.
   *
   * Start a fresh move gesture
   * so there isn't a jump.
   */

  if(pointers.size === 1){

    const p =
      [...pointers.values()][0];


    gestureStart = {

      type:'move',

      pointerX:p.x,
      pointerY:p.y,

      pizzaX:pizzaX,
      pizzaY:pizzaY

    };

  }

}


fallbackModel.addEventListener(
  'pointerup',
  pointerEnd
);

fallbackModel.addEventListener(
  'pointercancel',
  pointerEnd
);

fallbackModel.addEventListener(
  'pointerleave',
  event => {

    /*
     * Don't delete pointer here.
     *
     * Pointer capture may still
     * be active.
     */

  }
);


/* =====================================================
   KEEP PIZZA INSIDE SCREEN
===================================================== */

function keepPizzaInsideScreen(){

  const baseSize =
    280 * pizzaScale;


  const half =
    baseSize / 2;


  pizzaX =
    Math.max(
      half,
      Math.min(
        window.innerWidth - half,
        pizzaX
      )
    );


  pizzaY =
    Math.max(
      half,
      Math.min(
        window.innerHeight - half,
        pizzaY
      )
    );

}


/* =====================================================
   PLACE / MOVE BUTTON
===================================================== */

placeBtn.addEventListener(

  'click',

  () => {

    /*
     * ================================================
     * MOVABLE → LOCK
     * ================================================
     */

    if(!pizzaLocked){

      pizzaLocked =
        true;


      pointers.clear();

      gestureStart =
        null;


      dragging =
        false;


      fallbackModel.classList.remove(
        'dragging'
      );


      /*
       * IMPORTANT:
       *
       * We DON'T change:
       *
       * pizzaX
       * pizzaY
       * pizzaScale
       * pizzaRotation
       *
       * Therefore everything remains
       * exactly where the user left it.
       */


      placeBtn.textContent =
        '↔ Move Pizza';


      document.getElementById(
        'camtip'
      ).textContent =
        '✓ Pizza fixed · Tap Move Pizza to reposition';


      return;

    }


    /*
     * ================================================
     * LOCKED → UNLOCK
     * ================================================
     */

    pizzaLocked =
      false;


    placeBtn.textContent =
      '✓ Place Pizza';


    document.getElementById(
      'camtip'
    ).textContent =
      'Drag • Pinch • Rotate, then tap Place Pizza';

  }

);


/* =====================================================
   CLOSE
===================================================== */

document
.getElementById('camx')
.addEventListener(
  'click',
  closeCam
);


function closeCam(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  stream = null;


  camv.srcObject =
    null;


  fallbackModel.style.display =
    'none';


  placeBtn.style.display =
    'none';


  pizzaLocked =
    false;


  dragging =
    false;


  pointers.clear();


  gestureStart =
    null;


  cam.style.display =
    'none';

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  'pagehide',
  closeCam
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  'resize',
  () => {

    if(
      fallbackModel.style.display !==
      'none'
    ){

      keepPizzaInsideScreen();

      updatePizza();

    }

  }
);

</script>

</body>
</html>
