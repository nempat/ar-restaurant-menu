<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Menu</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">
    <div class="restaurant-name">NEMPAT</div>
    <p class="tagline">Experience your food in 3D</p>
  </header>

  <main class="menu">

    <h1>Our Menu</h1>

    <div class="food-card">

      <img src="assets/images/pizza.jpg" alt="Pizza">

      <div class="food-info">
        <h2>Classic Pizza</h2>

        <p class="description">
          Golden crust, mozzarella, fresh vegetables and our signature sauce.
        </p>

        <div class="bottom-row">
          <span class="price">₹299</span>

          <button onclick="openAR('pizza')">
            View in AR ✨
          </button>
        </div>
      </div>

    </div>

  </main>

  <script>
    function openAR(food) {
      if (food === "pizza") {
        window.location.href = "ar.html";
      }
    }
  </script>

</body>
</html>
