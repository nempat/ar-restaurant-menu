<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Menu v5</title>

<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#fff8f0;
  color:#2b1d14
}

header{
  padding:26px 16px 6px;
  text-align:center
}

h1{
  margin:0;
  font-size:1.6rem
}

header p{
  margin:6px 0 0;
  color:#8a7566;
  font-size:.92rem
}

main{
  max-width:900px;
  margin:0 auto;
  padding:16px;
  display:grid;
  gap:18px;
  grid-template-columns:repeat(
    auto-fill,
    minmax(280px,1fr)
  )
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px #0002
}

.card model-viewer{
  width:100%;
  height:270px;
  background:#fff3e6
}

.info{
  padding:14px 16px 16px
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline
}

.row h2{
  margin:0;
  font-size:1.1rem
}

.price{
  font-weight:700;
  color:#d9381e
}

.info p{
  margin:6px 0 10px;
  color:#8a7566;
  font-size:.9rem
}

.btn{
  background:#d9381e;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-size:.95rem;
  font-weight:600;
  width:100%;
  cursor:pointer
}

.ar-btn{
  position:absolute;
  bottom:12px;
  right:12px;
  background:#2b1d14;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 16px;
  font-size:.9rem;
  font-weight:600
}

.note{
  margin:8px 16px 0;
  font-size:.8rem;
  color:#b00020;
  display:none
}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

#cam{
  position:fixed;
  inset:0;
  z-index:99;
  background:#000;
  display:none;
  overflow:hidden;

  /*
   * We handle touch gestures ourselves.
   */
  touch-action:none;
}

#cam video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover
}


/* =====================================================
   FALLBACK PIZZA
===================================================== */

#fallback-model{

  position:absolute;

  width:280px;
  height:280px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:transparent;

  --poster-color:transparent;
  --progress-bar-color:transparent;

  display:none;

  /*
   * Disable model-viewer's own
   * touch interaction.
   *
   * We move the whole element ourselves.
   */
  touch-action:none;

  user-select:none;
  -webkit-user-select:none;

  cursor:grab;
}

#fallback-model.dragging{
  cursor:grabbing;
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

#camx{
  position:absolute;
  top:14px;
  right:14px;

  z-index:10;

  background:#fff;
  border:0;
  border-radius:999px;

  padding:10px 16px;

  font-weight:700;

  cursor:pointer
}


/* =====================================================
   CAMERA TIP
===================================================== */

#camtip{
  position:absolute;

  bottom:22px;
  left:0;
  right:0;

  text-align:center;

  color:#fff;

  font-size:.9rem;

  text-shadow:
    0 1px 4px #000;

  z-index:5;

  pointer-events:none
}


/* =====================================================
   PLACE / MOVE BUTTON
===================================================== */

#placeBtn{

  position:absolute;

  bottom:65px;
  left:50%;

  transform:
    translateX(-50%);

  z-index:10;

  background:#d9381e;

  color:#fff;

  border:0;

  border-radius:999px;

  padding:12px 22px;

  font-size:.95rem;

  font-weight:700;

  display:none;

  cursor:pointer
}

</style>
</head>


<body>


<header>

  <h1>
    🍕 Our Menu (v3)
  </h1>

  <p>
    See the dish on your table through your camera. No app needed.
  </p>

</header>


<main id="menu"></main>


<!-- ==================================================
     CAMERA FALLBACK
================================================== -->

<div id="cam">

  <video
    id="camv"
    autoplay
    playsinline
    muted>
  </video>


  <model-viewer

    id="fallback-model"

    interaction-prompt="none"

    shadow-intensity="1"

    touch-action="none">

  </model-viewer>


  <button id="placeBtn">
    ✓ Place Pizza
  </button>


  <button id="camx">
    ✕ Close
  </button>


  <div id="camtip">

    Move the pizza to where you want it,
    then tap Place Pizza

  </div>

</div>



<script>

/* =====================================================
   MENU
===================================================== */

const ITEMS = [

  {
    name:"Margherita Pizza",
    price:"₹349",
    desc:"Tomato, mozzarella, fresh basil."
  },

  {
    name:"Farmhouse Pizza",
    price:"₹429",
    desc:"Loaded with veggies and cheese."
  }

];


const PATHS = [

  'pizza.glb',

  'assets/pizza.glb',

  'models/pizza.glb'

];


/* =====================================================
   CREATE MENU
===================================================== */

document.getElementById('menu').innerHTML =

ITEMS.map((item,index) => `

  <article class="card">

    <model-viewer

      id="model-${index}"

      src="${PATHS[0]}"

      alt="${item.name}"

      ar

      ar-modes="webxr"

      ar-placement="floor"

      ar-scale="fixed"

      camera-controls

      auto-rotate

      shadow-intensity="1"

      touch-action="pan-y"

      interaction-prompt="auto"

      loading="lazy"

    >

      <button
        slot="ar-button"
        class="ar-btn">

        📱 Place on surface

      </button>

    </model-viewer>


    <div class="note"></div>


    <div class="info">

      <div class="row">

        <h2>
          ${item.name}
        </h2>

        <span class="price">
          ${item.price}
        </span>

      </div>


      <p>
        ${item.desc}
      </p>


      <button
        class="btn camopen"
        data-index="${index}">

        📷 View with camera

      </button>

    </div>

  </article>

`).join('');


/* =====================================================
   MODEL FALLBACK
===================================================== */

document
.querySelectorAll('.card')
.forEach((card,index) => {

  const mv =
    card.querySelector('model-viewer');

  let pathIndex = 0;


  mv.addEventListener(
    'error',
    () => {

      pathIndex++;


      if(pathIndex < PATHS.length){

        mv.src =
          PATHS[pathIndex];

      }

      else{

        const note =
          card.querySelector('.note');

        note.style.display =
          'block';

        note.textContent =
          'pizza.glb not found in your repo.';

      }

    }
  );


  /* =================================================
     CAMERA BUTTON
  ================================================= */

  card
  .querySelector('.camopen')
  .addEventListener(
    'click',
    () => {

      openAR(mv.src);

    }
  );

});


/* =====================================================
   CAMERA ELEMENTS
===================================================== */

const cam =
  document.getElementById('cam');

const camv =
  document.getElementById('camv');

const fallbackModel =
  document.getElementById(
    'fallback-model'
  );

const placeBtn =
  document.getElementById(
    'placeBtn'
  );

let stream = null;


/* =====================================================
   PIZZA STATE
===================================================== */

/*
 * false = user can drag
 * true  = pizza is fixed
 */

let pizzaLocked = false;

let dragging = false;

let dragPointerId = null;

let startX = 0;
let startY = 0;

let startLeft = 0;
let startTop = 0;


/* =====================================================
   OPEN AR
===================================================== */

async function openAR(src){

  const webxrSupported =
    await checkWebXR();


  if(webxrSupported){

    const models =
      document.querySelectorAll(
        'model-viewer'
      );


    for(const model of models){

      if(model.src === src){

        try{

          await model.activateAR();

          return;

        }

        catch(error){

          console.log(
            'WebXR failed:',
            error
          );

        }

      }

    }

  }


  /*
   * WebXR unavailable.
   *
   * Use camera fallback.
   */

  openCameraFallback(src);

}


/* =====================================================
   CHECK WEBXR
===================================================== */

async function checkWebXR(){

  if(!navigator.xr){

    return false;

  }


  try{

    return await navigator.xr.isSessionSupported(
      'immersive-ar'
    );

  }

  catch(error){

    console.log(
      'WebXR detection failed:',
      error
    );

    return false;

  }

}


/* =====================================================
   CAMERA FALLBACK
===================================================== */

async function openCameraFallback(src){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:'environment'
          }
        },

        audio:false

      });


    camv.srcObject =
      stream;


    fallbackModel.src =
      src;


    /*
     * Reset position.
     */

    fallbackModel.style.left =
      '50%';

    fallbackModel.style.top =
      '50%';

    fallbackModel.style.transform =
      'translate(-50%,-50%)';


    /*
     * Reset state.
     */

    pizzaLocked = false;

    dragging = false;

    dragPointerId = null;


    /*
     * Reset button.
     */

    placeBtn.textContent =
      '✓ Place Pizza';


    /*
     * Show.
     */

    fallbackModel.style.display =
      'block';

    placeBtn.style.display =
      'block';

    cam.style.display =
      'block';


    document.getElementById(
      'camtip'
    ).textContent =
      'Move the pizza to where you want it, then tap Place Pizza';

  }

  catch(error){

    console.error(error);


    alert(
      'Camera could not start. ' +
      'Please allow camera permission ' +
      'and make sure this website uses HTTPS.'
    );

  }

}


/* =====================================================
   GET PIZZA CENTER
===================================================== */

function getPizzaPosition(){

  const rect =
    fallbackModel.getBoundingClientRect();


  return {

    left:
      rect.left +
      rect.width / 2,

    top:
      rect.top +
      rect.height / 2

  };

}


/* =====================================================
   START DRAG
===================================================== */

fallbackModel.addEventListener(

  'pointerdown',

  (event) => {

    /*
     * 🔒 FIXED?
     *
     * Don't allow dragging.
     */

    if(pizzaLocked){

      return;

    }


    event.preventDefault();


    dragging = true;

    dragPointerId =
      event.pointerId;


    startX =
      event.clientX;

    startY =
      event.clientY;


    const pos =
      getPizzaPosition();


    startLeft =
      pos.left;

    startTop =
      pos.top;


    fallbackModel.classList.add(
      'dragging'
    );


    try{

      fallbackModel.setPointerCapture(
        event.pointerId
      );

    }

    catch(error){

      console.log(
        'Pointer capture failed:',
        error
      );

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   DRAG
===================================================== */

fallbackModel.addEventListener(

  'pointermove',

  (event) => {

    /*
     * Don't move if:
     *
     * - not dragging
     * - locked
     * - wrong pointer
     */

    if(

      !dragging ||

      pizzaLocked ||

      event.pointerId !== dragPointerId

    ){

      return;

    }


    event.preventDefault();


    const dx =
      event.clientX -
      startX;


    const dy =
      event.clientY -
      startY;


    let newLeft =
      startLeft + dx;


    let newTop =
      startTop + dy;


    /*
     * Keep pizza inside viewport.
     */

    const rect =
      fallbackModel.getBoundingClientRect();


    const halfW =
      rect.width / 2;


    const halfH =
      rect.height / 2;


    newLeft =
      Math.max(

        halfW,

        Math.min(

          window.innerWidth -
          halfW,

          newLeft

        )

      );


    newTop =
      Math.max(

        halfH,

        Math.min(

          window.innerHeight -
          halfH,

          newTop

        )

      );


    /*
     * Set exact pixel position.
     */

    fallbackModel.style.left =
      newLeft + 'px';


    fallbackModel.style.top =
      newTop + 'px';


    fallbackModel.style.transform =
      'translate(-50%,-50%)';

  },

  {
    passive:false
  }

);


/* =====================================================
   STOP DRAG
===================================================== */

function stopDragging(event){

  if(
    event.pointerId !== dragPointerId
  ){

    return;

  }


  dragging = false;

  dragPointerId = null;


  fallbackModel.classList.remove(
    'dragging'
  );

}


fallbackModel.addEventListener(
  'pointerup',
  stopDragging
);


fallbackModel.addEventListener(
  'pointercancel',
  stopDragging
);


/* =====================================================
   PLACE / MOVE BUTTON
===================================================== */

placeBtn.addEventListener(

  'click',

  () => {

    /*
     * ================================================
     * CURRENTLY MOVABLE
     *
     * → FIX IT
     * ================================================
     */

    if(!pizzaLocked){

      pizzaLocked = true;

      dragging = false;

      dragPointerId = null;


      fallbackModel.classList.remove(
        'dragging'
      );


      /*
       * IMPORTANT:
       *
       * We DO NOT change:
       *
       * left
       * top
       * transform
       *
       * So the pizza stays EXACTLY
       * where the user dragged it.
       */


      placeBtn.textContent =
        '↔ Move Pizza';


      document.getElementById(
        'camtip'
      ).textContent =
        '✓ Pizza fixed · Tap Move Pizza to reposition';


      return;

    }


    /*
     * ================================================
     * CURRENTLY FIXED
     *
     * → UNLOCK IT
     * ================================================
     */

    pizzaLocked = false;


    placeBtn.textContent =
      '✓ Place Pizza';


    document.getElementById(
      'camtip'
    ).textContent =
      'Drag the pizza to a new position, then tap Place Pizza';

  }

);


/* =====================================================
   CLOSE
===================================================== */

document
.getElementById('camx')
.addEventListener(
  'click',
  closeCam
);


function closeCam(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  stream = null;


  camv.srcObject =
    null;


  fallbackModel.style.display =
    'none';


  placeBtn.style.display =
    'none';


  pizzaLocked =
    false;


  dragging =
    false;


  dragPointerId =
    null;


  cam.style.display =
    'none';

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  'pagehide',
  closeCam
);

</script>

</body>
</html>
